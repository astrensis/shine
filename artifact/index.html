<title>既読スルー禁止</title>
<style>
  :root{
    --bg-outer:#050506;
    --frame-shadow: rgba(0,0,0,.6);
    --list-bg:#0f1115;
    --list-header:#0b0c10;
    --list-border: rgba(255,255,255,.07);
    --list-text:#f2f3f5;
    --list-sub:#8a8f98;
    --danger:#e5484d;
    --success:#2fbf71;
    --warn:#f2b134;
    --chat-bg:#849ebf;
    --chat-header:#333333;
    --bubble-them:#ffffff;
    --bubble-me:#5ac463;
    --bubble-text:#141414;
    --accent:#06c755;
    --statusbar:#000;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
  :root[data-theme="dark"]{ color-scheme: dark; }

  *{box-sizing:border-box;}
  body{
    background:var(--bg-outer);
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding-block:20px;
  }
  #stage{
    width:100%; max-width:430px;
    height:min(900px, calc(100dvh - 40px));
    background:#000; border-radius:38px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px var(--frame-shadow), 0 0 0 1px rgba(255,255,255,.05);
    display:flex; flex-direction:column;
  }

  /* ---------- ステータスバー ---------- */
  .statusbar{
    background:var(--statusbar); color:#fff; flex-shrink:0;
    padding:calc(6px + env(safe-area-inset-top,0px)) 22px 4px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;
    position:relative; z-index:50;
  }
  .statusbar .sb-icons{ display:flex; align-items:center; gap:5px; }

  .app-body{ position:relative; flex:1; min-height:0; }
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- Chat List ---------- */
  #list-screen{ background:var(--list-bg); }
  .list-header{
    background:var(--list-header); padding:16px 18px 10px;
    border-bottom:1px solid var(--list-border);
  }
  .list-header-top{ display:flex; align-items:center; justify-content:space-between; }
  .list-header-top h1{ color:var(--list-text); font-size:19px; font-weight:800; margin:0; }
  .reset-btn{
    background:transparent; border:1px solid rgba(255,255,255,.14); color:var(--list-sub);
    font-size:11px; padding:6px 12px; border-radius:999px; cursor:pointer;
    display:flex; align-items:center; gap:5px; font-family:inherit;
  }
  .reset-btn:hover{ color:var(--list-text); border-color:rgba(255,255,255,.3); }
  .list-stats{ display:flex; gap:10px; margin-top:10px; }
  .stat-pill{
    flex:1; background:rgba(255,255,255,.05); border:1px solid var(--list-border);
    border-radius:12px; padding:8px 10px;
  }
  .stat-pill .num{ font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-pill.success .num{ color:var(--success); }
  .stat-pill.bad .num{ color:var(--danger); }
  .stat-pill .lbl{ font-size:9.5px; color:var(--list-sub); margin-top:1px; }

  .thread-list{ flex:1; overflow-y:auto; }
  .thread{
    width:100%; display:flex; align-items:center; gap:12px; padding:12px 18px;
    background:transparent; border:none; border-bottom:1px solid var(--list-border);
    text-align:left; cursor:pointer; font-family:inherit;
  }
  .thread:hover{ background:rgba(255,255,255,.04); }
  .thread-avatar{
    width:46px;height:46px;border-radius:50%; flex-shrink:0; position:relative;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .thread-avatar.locked{ filter:grayscale(1) brightness(.5); }
  .unread-dot{
    position:absolute; top:-2px; right:-2px; width:16px;height:16px;border-radius:50%;
    background:var(--danger); color:#fff; font-size:9.5px; font-weight:700;
    display:flex;align-items:center;justify-content:center; border:2px solid var(--list-bg);
  }
  .thread-body{ flex:1; min-width:0; }
  .thread-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .thread-name{ color:var(--list-text); font-size:14.5px; font-weight:700; }
  .thread-sub{ color:var(--list-sub); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{ font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap; }
  .badge.success{ color:var(--success); border-color:rgba(47,191,113,.4); background:rgba(47,191,113,.12); }
  .badge.bad{ color:var(--danger); border-color:rgba(229,72,77,.4); background:rgba(229,72,77,.12); }
  .badge.progress{ color:var(--warn); border-color:rgba(242,177,52,.4); background:rgba(242,177,52,.12); }
  .badge.locked{ color:#5a5e66; border-color:rgba(255,255,255,.1); background:rgba(255,255,255,.03); }

  .toast{
    position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:#161a20; color:#fff; padding:10px 16px; border-radius:12px;
    font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.1); z-index:60; white-space:nowrap;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }

  /* ---------- Chat Room ---------- */
  #chat-screen{ background:var(--chat-bg); }
  .chat-header{
    background:var(--chat-header); color:#fff; padding:9px 10px; display:flex; align-items:center; gap:9px;
    flex-shrink:0; position:relative; z-index:5;
  }
  .icon-btn{ background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px; opacity:.9; }
  .icon-btn:hover{ opacity:1; }
  .chat-header-avatar{ width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
  .chat-header-info{ flex:1; min-width:0; }
  .chat-header-name{ font-size:13.5px; font-weight:700; }
  .chat-header-status{ font-size:10px; margin-top:1px; color:#c7c7c7; }
  .chat-header-status.typing{ color:#8fe05a; }
  .chat-header-status.offline{ color:var(--danger); }
  .chat-header-status.waiting{ color:var(--warn); }
  .fast-toggle{
    display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15); border-radius:999px; padding:5px 9px;
    font-size:10px; font-weight:700; cursor:pointer; color:#c7c7c7; flex-shrink:0;
  }
  .fast-toggle.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .timeline{ flex:1; overflow-y:auto; padding:12px 0 6px; position:relative; z-index:1; }

  .msg-row{ display:flex; padding:0 10px; margin:5px 0; }
  .msg-row.them{ justify-content:flex-start; }
  .msg-row.me{ justify-content:flex-end; }
  .msg-avatar{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;
    flex-shrink:0; margin-right:6px; align-self:flex-end; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .msg-wrap{ display:flex; align-items:flex-end; gap:5px; max-width:75%; }
  .msg-row.me .msg-wrap{ flex-direction:row-reverse; }
  .bubble{
    position:relative; padding:8px 12px; border-radius:16px; font-size:13.5px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .msg-row.them .bubble{ background:var(--bubble-them); color:var(--bubble-text); border-top-left-radius:3px; }
  .msg-row.me .bubble{ background:var(--bubble-me); color:#0b2b0b; border-top-right-radius:3px; }
  .msg-row.them .bubble::before{
    content:''; position:absolute; top:0; left:-6px; width:10px; height:10px;
    background:var(--bubble-them); clip-path:polygon(100% 0, 100% 100%, 0 0);
  }
  .msg-row.me .bubble::before{
    content:''; position:absolute; top:0; right:-6px; width:10px; height:10px;
    background:var(--bubble-me); clip-path:polygon(0 0, 100% 0, 0 100%);
  }
  .msg-meta{ display:flex; flex-direction:column; font-size:9.5px; color:rgba(20,20,20,.6); flex-shrink:0; line-height:1.5; }
  .msg-row.them .msg-meta{ align-items:flex-start; }
  .msg-row.me .msg-meta{ align-items:flex-end; }
  .msg-meta .read-label{ color:rgba(20,20,20,.45); }
  .msg-meta .read-label.is-read{ color:rgba(20,20,20,.6); font-weight:700; }

  .sys-row{ display:flex; justify-content:center; padding:9px 24px; }
  .sys-inner{ display:flex; flex-direction:column; align-items:center; gap:7px; max-width:88%; }
  .sys-text{ font-size:10.5px; color:rgba(20,20,20,.65); background:rgba(255,255,255,.55); padding:4px 12px; border-radius:999px; text-align:center; }

  .eerie-frame{ width:100%; max-width:200px; border-radius:11px; overflow:hidden; border:1px solid rgba(0,0,0,.4); box-shadow:0 6px 18px rgba(0,0,0,.35); animation: flicker 2.6s linear infinite; }
  .eerie-frame svg{ display:block; width:100%; aspect-ratio:3/2; background:#000; }
  .eerie-caption{ background:rgba(0,0,0,.82); color:#9aa0a8; font-size:9px; font-family:ui-monospace,monospace; padding:4px 8px; }

  .glitch{ position:relative; display:inline-block; color:#ff3b3b; text-shadow:2px 0 #00e5ff, -2px 0 #ff00c8; animation: glitchJitter .13s infinite steps(2); }

  .typing-row{ display:flex; padding:0 10px; margin:5px 0; align-items:flex-end; }
  .typing-bubble{ background:#fff; border-radius:16px; border-top-left-radius:3px; padding:10px 14px; display:flex; gap:4px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .typing-dot{ width:6px;height:6px;border-radius:50%; background:#9a9a9a; animation:bounceDot 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2){ animation-delay:.15s; }
  .typing-dot:nth-child(3){ animation-delay:.3s; }

  /* ---------- 潜伏タイマー ---------- */
  .action-timer-row{ display:flex; justify-content:center; padding:14px 22px; }
  .action-timer{
    width:100%; max-width:280px; background:rgba(10,10,14,.72); border:1px solid rgba(255,80,80,.35);
    border-radius:16px; padding:14px 16px; backdrop-filter:blur(2px);
  }
  .at-label{ color:#ff8f8f; font-size:11.5px; font-weight:700; text-align:center; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .at-label .dot{ width:6px;height:6px;border-radius:50%; background:#ff4d4d; animation:pulseDot 1s infinite; }
  .at-bar-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .at-bar-fill{ height:100%; background:linear-gradient(90deg,#ff4d4d,#ff8f4d); border-radius:999px; transition:width .1s linear; }
  .at-count{ text-align:center; color:#fff; font-size:19px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }

  /* ---------- 入力バー（装飾） ---------- */
  .input-bar{
    flex-shrink:0; background:#f1f1f1; border-top:1px solid rgba(0,0,0,.08);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:7px;
    position:relative; z-index:2;
  }
  .input-bar .ib-icon{ width:26px;height:26px; flex-shrink:0; display:flex;align-items:center;justify-content:center; color:#8b8f96; }
  .input-bar .ib-field{
    flex:1; background:#fff; border-radius:18px; padding:8px 14px; font-size:12.5px; color:#a8adb5;
    border:1px solid rgba(0,0,0,.06);
  }

  /* ---------- 選択肢（入力エリアの上にオーバーレイ） ---------- */
  .choices{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    background:#eef1f4; border-top:1px solid rgba(0,0,0,.08);
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:8px;
    transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
  }
  .choices.show{ transform:translateY(0); }
  .choice-btn{
    width:100%; text-align:left; padding:12px 14px; border-radius:14px; background:#fff;
    border:1px solid rgba(0,0,0,.06); box-shadow:0 2px 6px rgba(0,0,0,.08);
    font-size:13px; color:#1a1a1a; font-weight:600; cursor:pointer; font-family:inherit;
    transition:transform .1s ease, background .15s ease;
  }
  .choice-btn:hover{ background:#fafafa; }
  .choice-btn:active{ transform:scale(.98); }

  .call-flash{ position:absolute; inset:0; z-index:30; background:#000; display:flex; align-items:center; justify-content:center; animation: flashRed .5s ease-in-out 2; }
  .call-flash span{ color:var(--danger); font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.08em; }

  /* ---------- Result Modal ---------- */
  #result-modal{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.82); }
  #result-modal.show{ display:flex; }
  .result-card{ width:100%; max-width:310px; border-radius:20px; padding:26px 22px; text-align:center; background:#111318; border:1px solid rgba(255,255,255,.08); }
  .result-card.success{ border-color:rgba(47,191,113,.35); }
  .result-card.bad{ border-color:rgba(229,72,77,.4); }
  .result-icon{ font-size:42px; margin-bottom:6px; }
  .result-kicker{ font-size:11.5px; font-weight:800; letter-spacing:.08em; margin-bottom:4px; }
  .result-card.success .result-kicker{ color:var(--success); }
  .result-card.bad .result-kicker{ color:var(--danger); }
  .result-title{ color:#fff; font-size:16.5px; font-weight:800; margin-bottom:9px; }
  .result-desc{ color:#a8adb5; font-size:12.5px; line-height:1.7; margin-bottom:12px; }
  .result-unlock{ font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:16px; min-height:1px; }
  .result-actions{ display:flex; flex-direction:column; gap:9px; }
  .result-btn{ width:100%; padding:12px; border-radius:999px; border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
  .result-btn.retry{ background:rgba(255,255,255,.1); color:#fff; }
  .result-btn.retry:hover{ background:rgba(255,255,255,.16); }
  .result-btn.back{ background:var(--accent); color:#fff; }
  .result-btn.back:hover{ filter:brightness(1.08); }

  @keyframes shake{ 0%,100%{transform:translate(0,0);} 10%{transform:translate(-2px,1px);} 20%{transform:translate(2px,-1px);} 30%{transform:translate(-3px,0);} 40%{transform:translate(3px,1px);} 50%{transform:translate(-1px,-2px);} 60%{transform:translate(1px,2px);} 70%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} 90%{transform:translate(-1px,0);} }
  @keyframes shakeHard{ 0%,100%{transform:translate(0,0);} 25%{transform:translate(-4px,2px);} 50%{transform:translate(4px,-2px);} 75%{transform:translate(-3px,-3px);} }
  .fx-shake{ animation:shake .4s ease-in-out; }
  .fx-shake-hard{ animation:shakeHard .12s ease-in-out 4; }
  @keyframes flashRed{ 0%,100%{background-color:transparent;} 50%{background-color:rgba(220,38,38,.32);} }
  .fx-flash{ animation:flashRed .5s ease-in-out 2; }
  @keyframes flicker{ 0%,100%{opacity:1;} 45%{opacity:1;} 46%{opacity:.3;} 47%{opacity:1;} 48%{opacity:.2;} 49%{opacity:1;} }
  @keyframes glitchJitter{ 0%{transform:translate(0,0);} 25%{transform:translate(-1px,1px);} 50%{transform:translate(1px,-1px);} 75%{transform:translate(-1px,-1px);} 100%{transform:translate(1px,1px);} }
  @keyframes bounceDot{ 0%,80%,100%{transform:translateY(0); opacity:.5;} 40%{transform:translateY(-4px); opacity:1;} }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  @media (prefers-reduced-motion: reduce){
    .fx-shake,.fx-shake-hard,.fx-flash,.eerie-frame,.glitch,.typing-dot,.at-label .dot{ animation:none !important; }
  }
</style>

<div id="stage">
  <div class="statusbar">
    <span id="sb-time">0:00</span>
    <div class="sb-icons">
      <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="7" width="3" height="4" rx=".5" fill="#fff"/><rect x="4.5" y="5" width="3" height="6" rx=".5" fill="#fff"/><rect x="9" y="3" width="3" height="8" rx=".5" fill="#fff"/><rect x="13" y="0" width="3" height="11" rx=".5" fill="#fff"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 9.5a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6z" fill="#fff"/><path d="M3.8 6.8a5.2 5.2 0 017.4 0l-1.2 1.2a3.5 3.5 0 00-5 0z" fill="#fff"/><path d="M1 4a9 9 0 0113 0L12.8 5.2a7.3 7.3 0 00-10.6 0z" fill="#fff"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="19" height="10" rx="2.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.2" fill="#fff"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
    </div>
  </div>

  <div class="app-body">
    <!-- ============ Chat List ============ -->
    <div id="list-screen" class="screen active">
      <div class="list-header">
        <div class="list-header-top">
          <h1>トーク</h1>
          <button class="reset-btn" id="reset-btn">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            初期化
          </button>
        </div>
        <div class="list-stats">
          <div class="stat-pill success"><div class="num" id="stat-cleared">0/30</div><div class="lbl">救出成功</div></div>
          <div class="stat-pill bad"><div class="num" id="stat-bad">0/30</div><div class="lbl">BAD END回収</div></div>
        </div>
      </div>
      <div class="thread-list" id="thread-list"></div>
      <div id="toast-holder"></div>
    </div>

    <!-- ============ Chat Room ============ -->
    <div id="chat-screen" class="screen">
      <div class="chat-header">
        <button class="icon-btn" id="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="chat-header-avatar" id="chat-avatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-name"></div>
          <div class="chat-header-status" id="chat-status">オンライン</div>
        </div>
        <button class="fast-toggle" id="fast-toggle">⏩ FAST</button>
        <button class="icon-btn" id="call-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="input-bar">
        <span class="ib-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg></span>
        <div class="ib-field">メッセージを入力</div>
        <span class="ib-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg></span>
      </div>
      <div class="choices" id="choices"></div>
      <div id="call-flash-holder"></div>
    </div>
  </div>

  <!-- ============ Result Modal ============ -->
  <div id="result-modal">
    <div class="result-card" id="result-card">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-kicker" id="result-kicker"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-desc" id="result-desc"></div>
      <div class="result-unlock" id="result-unlock"></div>
      <div class="result-actions">
        <button class="result-btn retry" id="retry-btn">もう一度やり直す</button>
        <button class="result-btn back" id="backlist-btn">トーク一覧へ戻る</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // 0. ステータスバー時計
  // ============================================================
  function tickClock(){
    const d = new Date();

  // ============================================================
  // 1. サウンドエンジン
  // ============================================================
  const SoundEngine = (function(){
    let ctx=null, master=null;
    function ensure(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC(); master = ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
      }
      if(ctx.state==='suspended') ctx.resume();
      return ctx;
    }
    function unlock(){ try{ ensure(); }catch(e){} }
    function tone(freq,start,dur,opt){
      opt=opt||{};
      const c=ensure(); const osc=c.createOscillator(); const gain=c.createGain();
      osc.type=opt.type||'sine'; osc.frequency.setValueAtTime(freq,start);
      if(opt.freqEnd!==undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(opt.freqEnd,1), start+dur);
      const peak=opt.gain!==undefined?opt.gain:.3, attack=opt.attack!==undefined?opt.attack:.01, release=opt.release!==undefined?opt.release:dur*.6;
      gain.gain.setValueAtTime(.0001,start); gain.gain.exponentialRampToValueAtTime(peak,start+attack); gain.gain.exponentialRampToValueAtTime(.0001,start+attack+release);
      osc.connect(gain); gain.connect(master); osc.start(start); osc.stop(start+dur+.05);
    }
    function noiseBuffer(dur){
      const c=ensure(); const size=Math.floor(c.sampleRate*dur); const buf=c.createBuffer(1,size,c.sampleRate); const data=buf.getChannelData(0);
      for(let i=0;i<size;i++) data[i]=Math.random()*2-1;
      return buf;
    }
    return {
      unlock,
      receive(){ const c=ensure(),now=c.currentTime; tone(880,now,.11,{gain:.26,attack:.004}); tone(1760,now+.08,.14,{gain:.22,attack:.004}); },
      send(){ const c=ensure(),now=c.currentTime; tone(700,now,.07,{freqEnd:900,gain:.17,attack:.004}); },
      readChime(){ const c=ensure(),now=c.currentTime; tone(1500,now,.09,{gain:.1,attack:.006}); },
      heartbeat(){ const c=ensure(),now=c.currentTime; tone(50,now,.16,{gain:.5,freqEnd:35,attack:.01,release:.11}); tone(48,now+.17,.16,{gain:.4,freqEnd:30,attack:.01,release:.11}); },
      fearNoise(dur){ dur=dur||.8; const c=ensure(),now=c.currentTime;
        const noise=c.createBufferSource(); noise.buffer=noiseBuffer(dur);
        const ng=c.createGain(); ng.gain.setValueAtTime(.0001,now); ng.gain.exponentialRampToValueAtTime(.18,now+.05); ng.gain.exponentialRampToValueAtTime(.0001,now+dur);
        const filt=c.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=1200; filt.Q.value=.7;
        noise.connect(filt); filt.connect(ng); ng.connect(master); noise.start(now); noise.stop(now+dur);
        tone(185,now,dur,{type:'sawtooth',gain:.12,attack:.02,release:dur*.8}); tone(196,now+.02,dur,{type:'sawtooth',gain:.1,attack:.02,release:dur*.8});
      },
      callEnd(){ const c=ensure(),now=c.currentTime;
        const noise=c.createBufferSource(); noise.buffer=noiseBuffer(.6);
        const g=c.createGain(); g.gain.setValueAtTime(.3,now); g.gain.exponentialRampToValueAtTime(.0001,now+.6);
        const filt=c.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=800;
        noise.connect(filt); filt.connect(g); g.connect(master); noise.start(now); noise.stop(now+.6);
        tone(320,now,.3,{type:'square',gain:.15,freqEnd:60});
      },
      alarm(){ const c=ensure(),now=c.currentTime; for(let i=0;i<4;i++){ const t=now+i*.3; tone(880,t,.15,{type:'square',gain:.2}); tone(660,t+.15,.15,{type:'square',gain:.2}); } }
    };
  })();

  function playSound(name){
    switch(name){
      case 'receive': SoundEngine.receive(); break;
      case 'send': SoundEngine.send(); break;
      case 'readChime': SoundEngine.readChime(); break;
      case 'heartbeat': SoundEngine.heartbeat(); break;
      case 'noise': SoundEngine.fearNoise(); break;
      case 'callEnd': SoundEngine.callEnd(); break;
      case 'alarm': SoundEngine.alarm(); break;
    }
  }

            {sender:'them', text:'『'+title+'』の状況に巻き込まれました', effect:'shake'},
            {sender:'them', text:'助けてください、'+f.verb+'が止まらないんです…'},
          ], choices:[
            {label:'落ち着いて周囲を確認させろ', next:'mid'},
            {label:'今すぐそこから飛び出させろ', next:'c1_bad'},
          ] },
        c1_bad:{ messages:[
            {sender:'them', text:'今、飛び出します…！'},
            {sender:'system', text:f.place+'の奥で、何かが動く', sound:'noise', effect:'shake-hard'},
            {sender:'them', text:'……', glitch:true},
          ], autoNext:'end_bad1', autoDelay:1400 },
        end_bad1:{ messages:[], ending:{type:'bad', title:'通信途絶',
          desc:name+'は衝動的に動いてしまった。それを最後に、返信は途絶えた。'} },
        mid:{ messages:[
            {sender:'them', text:'…わかりました、落ち着きます'},
            {sender:'system', text:'', image:{kind:f.bg, caption:f.place+'の様子'}, effect:'shake'},
            {sender:'them', text:'…何かがこちらに気づいたかもしれません', effect:'shake-hard'},
            {sender:'them', text:'少しの間、じっとしています。物音立てられないので待ってて…'},
            {type:'actionWait', seconds: 15 + (idx%4)*5, label:name+'が'+f.place+'で息を潜めています…'},
          ], autoNext:'climax' },
        climax:{ messages:[
            {sender:'them', text:'動きがありました', effect:'shake'},
            {sender:'them', text:'こっちに向かってきてる気がします…！どうすれば！？', effect:'shake-hard'},
          ], choices:[
            {label:'一気に脱出ルートへ走らせろ！', next:'end_survive'},
            {label:'物陰でやり過ごさせろ', next:'end_bad2'},
          ] },
        end_bad2:{ messages:[
            {sender:'them', text:'物陰に隠れます…'},
            {sender:'system', text:'', image:{kind:f.bgAlt, caption:'異常の接近'}, effect:'flash'},
            {sender:'them', text:'みつかった', glitch:true},
          ], autoNext:'end_bad2_final', autoDelay:1600 },
        end_bad2_final:{ messages:[], ending:{type:'bad', title:'通信途絶',
          desc:'物陰に隠れきれず、'+name+'は見つかってしまった。それを最後に、通信は途絶えた。'} },
        end_survive:{ messages:[
            {sender:'them', text:'走ります…！'},
            {sender:'system', text:'背後の気配が、少しずつ遠ざかっていく'},
            {sender:'them', text:'抜け出せました…！本当にありがとうございました…！'},
          ], autoNext:'end_survive_final', autoDelay:1400 },
        end_survive_final:{ messages:[], ending:{type:'success', title:'救出成功',
          desc:name+'は冷静な指示のもと、危機を脱して無事に生還した。'} },
      }
    };
  }

  const TEMPLATE_DEFS = [
    // 人コワ・サスペンス 残り7
    ['ストーカー','horror','人コワ・サスペンス'],
    ['隣人の壁ドン','horror','人コワ・サスペンス'],
    ['闇バイト逃走','horror','人コワ・サスペンス'],
    ['煽り運転','horror','人コワ・サスペンス'],
    ['覗き魔','horror','人コワ・サスペンス'],
    ['マッチングアプリ','horror','人コワ・サスペンス'],
    ['深夜の侵入者','horror','人コワ・サスペンス'],
    // オカルト・都市伝説 残り7
    ['事故物件','occult','現代怪異・オカルト'],
    ['廃村配信','occult','現代怪異・オカルト'],
    ['こっくりさん','occult','現代怪異・オカルト'],
    ['深夜の学校','occult','現代怪異・オカルト'],
    ['樹海','occult','現代怪異・オカルト'],
    ['呪いの動画','occult','現代怪異・オカルト'],
    ['ドッペルゲンガー','occult','現代怪異・オカルト'],
    // 密室・極限サバイバル 残り6
    ['停止エレベーター','confine','極限密室・パニック'],
    ['水没地下室','confine','極限密室・パニック'],
    ['山小屋の吹雪','confine','極限密室・パニック'],
    ['沈没船','confine','極限密室・パニック'],
    ['火災ビル','confine','極限密室・パニック'],
    ['冷凍倉庫','confine','極限密室・パニック'],
    // サイコ・異常心理 7
    ['監禁実験','psycho','サイコ・異常心理'],
    ['強制鬼ごっこ','psycho','サイコ・異常心理'],
    ['裏アカウントの罠','psycho','サイコ・異常心理'],
    ['新興宗教','psycho','サイコ・異常心理'],
    ['親友の裏切り','psycho','サイコ・異常心理'],
    ['模倣犯','psycho','サイコ・異常心理'],
    ['謎のアンケート','psycho','サイコ・異常心理'],
  ];

  const templateScenarios = TEMPLATE_DEFS.map((def, i)=>{
    const idx = i+4; // char04〜char30
    const name = TEMPLATE_NAMES[i % TEMPLATE_NAMES.length];
    return buildTemplateScenario(idx, name, def[0], def[1], def[2]);
  });

  const scenarios = [char01, char02, char03, ...templateScenarios];
  function getScenario(id){ return scenarios.find(s=>s.id===id); }

  // ============================================================
  // 5. セーブデータ
  // ============================================================
  const SAVE_KEY = 'line-horror-save-v2';
  function defaultSave(){
    return {
      unlocked: scenarios.slice(0,3).map(s=>s.id),
      everCleared: [], everBad: [], latestStatus: {},
    };
  }
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return defaultSave();
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.unlocked)) return defaultSave();
      return Object.assign(defaultSave(), parsed);
    }catch(e){ return defaultSave(); }
  }
  function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();

  function isUnlocked(id){ return save.unlocked.indexOf(id) !== -1; }

  function unlockNext(){
    const next = scenarios.find(s => save.unlocked.indexOf(s.id) === -1);
    if(next){ save.unlocked.push(next.id); return next; }
    return null;
  }

  function recordEnding(id, type){
    save.latestStatus[id] = type;
    let unlockedChar = null;
    if(type === 'success' && save.everCleared.indexOf(id) === -1){
      save.everCleared.push(id);
      unlockedChar = unlockNext();
    }
    if(type === 'bad' && save.everBad.indexOf(id) === -1){
      save.everBad.push(id);
    }
    persist();
    return unlockedChar;
  }

  // ============================================================
  // 6. DOM参照
  // ============================================================
  const $ = (id)=>document.getElementById(id);
  const listScreen = $('list-screen'), chatScreen = $('chat-screen');
  const threadList = $('thread-list'), resultModal = $('result-modal');
  const timelineEl = $('timeline'), choicesEl = $('choices');
  const chatAvatar = $('chat-avatar'), chatName = $('chat-name'), chatStatus = $('chat-status');
  const callFlashHolder = $('call-flash-holder');
  const toastHolder = $('toast-holder');
  const fastToggle = $('fast-toggle');

  let currentScenario = null;
  let genToken = 0;

  fastToggle.addEventListener('click', ()=>{
    FAST = !FAST;
    fastToggle.classList.toggle('on', FAST);
  });

  // ------------------------------------------------------------
  // トーク一覧
  // ------------------------------------------------------------
  function renderList(){
    $('stat-cleared').textContent = save.everCleared.length + '/' + scenarios.length;
    $('stat-bad').textContent = save.everBad.length + '/' + scenarios.length;

    threadList.innerHTML = '';
    scenarios.forEach(sc=>{
      const unlocked = isUnlocked(sc.id);
      const status = save.latestStatus[sc.id];
      const btn = document.createElement('button');
      btn.className = 'thread';
      if(!unlocked) btn.style.opacity = '.45';
      btn.innerHTML = `
        <div class="thread-avatar ${unlocked?'':'locked'}" style="background:${sc.color}">
          ${unlocked ? sc.emoji : '🔒'}
          ${unlocked && !status ? '<span class="unread-dot">1</span>' : ''}
        </div>
        <div class="thread-body">
          <div class="thread-top">
            <span class="thread-name">${unlocked ? sc.name : '???'}</span>
            ${badgeHtml(unlocked, status)}
          </div>
          <div class="thread-sub">${unlocked ? (sc.title+' ─ '+sc.genre) : 'まだ解放されていません'}</div>
        </div>
      `;
      if(unlocked){
        btn.addEventListener('click', ()=> openScenario(sc.id));
      } else {
        btn.style.cursor = 'default';
      }
      threadList.appendChild(btn);
    });
  }
  function badgeHtml(unlocked, status){
    if(!unlocked) return '<span class="badge locked">未解放</span>';
    if(status==='success') return '<span class="badge success">救出成功</span>';
    if(status==='bad') return '<span class="badge bad">音信不通</span>';
    return '';
  }

  function showToast(text){
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span>📩</span><span>${text}</span>`;
    toastHolder.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=> el.remove(), 400);
    }, 2600);
  }

  $('reset-btn').addEventListener('click', ()=>{
    if(confirm('すべてのプレイ状況をリセットします。よろしいですか？')){
      save = defaultSave();
      persist();
      renderList();
    }
  });

  // ------------------------------------------------------------
  // 画面遷移
  // ------------------------------------------------------------
  function showScreen(el){ [listScreen, chatScreen].forEach(s=>s.classList.remove('active')); el.classList.add('active'); }

  function openScenario(id){
    SoundEngine.unlock();
    currentScenario = getScenario(id);
    renderList();
    startChat();
    showScreen(chatScreen);
  }

  $('back-btn').addEventListener('click', ()=>{ genToken++; showScreen(listScreen); });

  function handleCallTap(){
    SoundEngine.callEnd();
    const flash = document.createElement('div');
    flash.className = 'call-flash';
    flash.innerHTML = '<span>通話が強制切断されました</span>';
    callFlashHolder.appendChild(flash);
    setTimeout(()=> flash.remove(), 800);
  }
  $('call-btn').addEventListener('click', handleCallTap);

  // ------------------------------------------------------------
  // チャット進行エンジン
  // ------------------------------------------------------------
  function startChat(){
    timelineEl.innerHTML = '';
    choicesEl.classList.remove('show');
    choicesEl.innerHTML = '';
    chatAvatar.style.background = currentScenario.color;
    chatAvatar.textContent = currentScenario.emoji;
    chatName.textContent = currentScenario.name;
    setChatStatus('オンライン');
    runNode(currentScenario.startNodeId);
  }

  function setChatStatus(text, cls){
    chatStatus.textContent = text;
    chatStatus.className = 'chat-header-status' + (cls ? ' '+cls : '');
  }

  function nowLabel(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  function triggerScreenEffect(effect){
    const cls = effect==='shake' ? 'fx-shake' : effect==='shake-hard' ? 'fx-shake-hard' : effect==='flash' ? 'fx-flash' : null;
    if(!cls) return;
    chatScreen.classList.remove('fx-shake','fx-shake-hard','fx-flash');
    void chatScreen.offsetWidth;
    chatScreen.classList.add(cls);
    setTimeout(()=> chatScreen.classList.remove(cls), 650);
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function scrollToBottom(){ timelineEl.scrollTop = timelineEl.scrollHeight; }

  function appendSystemMessage(msg){
    const row = document.createElement('div'); row.className = 'sys-row';
    let inner = '<div class="sys-inner">';
    if(msg.text) inner += `<span class="sys-text">${escapeHtml(msg.text)}</span>`;
    if(msg.image){
      inner += `<div class="eerie-frame">${eerieSvg(msg.image.kind)}</div>`;
      if(msg.image.caption) inner += `<div class="eerie-caption">${escapeHtml(msg.image.caption)}</div>`;
    }
    inner += '</div>';
    row.innerHTML = inner;
    timelineEl.appendChild(row);
  }

  function appendThemMessage(msg){
    const time = nowLabel();
    const row = document.createElement('div'); row.className = 'msg-row them';
    const textHtml = msg.glitch ? `<span class="glitch">${escapeHtml(msg.text)}</span>` : escapeHtml(msg.text);
    row.innerHTML = `
      <div class="msg-avatar" style="background:${currentScenario.color}">${currentScenario.emoji}</div>
      <div class="msg-wrap">
        <div class="bubble">${textHtml}</div>
        <div class="msg-meta"><span>${time}</span></div>
      </div>`;
    timelineEl.appendChild(row);
  }

  // 「me」メッセージ：未読→(1.5〜3秒)→既読 の時差を再現
  async function appendMeMessage(text, myToken){
    const time = nowLabel();
    const row = document.createElement('div'); row.className = 'msg-row me';
    const readId = 'read-' + Math.random().toString(36).slice(2);
    row.innerHTML = `
      <div class="msg-wrap">
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="msg-meta"><span class="read-label" id="${readId}">未読</span><span>${time}</span></div>
      </div>`;
    timelineEl.appendChild(row);
    scrollToBottom();

    await wait(readDelay());
    if(myToken !== genToken) return;
    const label = document.getElementById(readId);
    if(label){ label.textContent = '既読'; label.classList.add('is-read'); }
    playSound('readChime');
  }

  function showTyping(show){
    let row = document.getElementById('typing-row');
    if(show){
      if(row) return;
      row = document.createElement('div'); row.id='typing-row'; row.className='typing-row';
      row.innerHTML = `
        <div class="msg-avatar" style="background:${currentScenario.color}">${currentScenario.emoji}</div>
        <div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
      timelineEl.appendChild(row); scrollToBottom();
    } else if(row){ row.remove(); }
  }

  // 潜伏・行動タイマー
  function runActionTimer(seconds, label, myToken){
    return new Promise(resolve=>{
      const totalMs = FAST ? 1400 : seconds*1000;
      const row = document.createElement('div'); row.className='action-timer-row';
      row.innerHTML = `
        <div class="action-timer">
          <div class="at-label"><span class="dot"></span><span>${escapeHtml(label)}</span></div>
          <div class="at-bar-track"><div class="at-bar-fill" id="at-fill" style="width:100%"></div></div>
          <div class="at-count" id="at-count">${FAST? '' : seconds}</div>
        </div>`;
      timelineEl.appendChild(row); scrollToBottom();
      setChatStatus(label, 'waiting');

      const fill = row.querySelector('#at-fill');
      const countEl = row.querySelector('#at-count');
      const start = performance.now();

      function tick(now){
        if(myToken !== genToken) return;
        const elapsed = now - start;
        const remain = Math.max(0, totalMs - elapsed);
        const pct = Math.max(0, 100 * remain / totalMs);
        fill.style.width = pct + '%';
        if(!FAST) countEl.textContent = Math.ceil(remain/1000) + '秒';
        if(remain <= 0){
          row.remove();
          resolve();
          return;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  async function runNode(nodeId){
    const myToken = ++genToken;
    const node = currentScenario.nodes[nodeId];
    if(!node) return;

    for(const msg of node.messages){
      if(myToken !== genToken) return;

      if(msg.type === 'actionWait'){
        await runActionTimer(msg.seconds, msg.label, myToken);
        if(myToken !== genToken) return;
        setChatStatus('オンライン');
        await wait(300);
        playSound('receive');
        continue;
      }

      if(msg.sender === 'them'){
        setChatStatus('入力中...', 'typing');
        showTyping(true);
        await wait(msg.delay || typingDelay());
        if(myToken !== genToken) return;
        showTyping(false);
        setChatStatus('オンライン');
        appendThemMessage(msg);
        playSound(msg.sound || 'receive');
        if(msg.effect) triggerScreenEffect(msg.effect);
        scrollToBottom();
        await wait(200);
      } else if(msg.sender === 'system'){
        if(msg.delay) await wait(msg.delay);
        if(myToken !== genToken) return;
        appendSystemMessage(msg);
        if(msg.sound) playSound(msg.sound);
        if(msg.effect) triggerScreenEffect(msg.effect);
        scrollToBottom();
        await wait(200);
      } else if(msg.sender === 'me'){
        // シナリオ側で明示された「自分の発言」（アドバイス等）
        await appendMeMessage(msg.text, myToken);
        if(myToken !== genToken) return;
      }
      if(myToken !== genToken) return;
    }

    if(myToken !== genToken) return;

    if(node.ending){
      setChatStatus('オフライン', 'offline');
      await wait(500);
      if(myToken !== genToken) return;
      finishScenario(node.ending);
      return;
    }

    if(node.choices && node.choices.length){
      renderChoices(node.choices);
      return;
    }

    if(node.autoNext){
      await wait(node.autoDelay || 1000);
      if(myToken !== genToken) return;
      runNode(node.autoNext);
    }
  }

  function renderChoices(choices){
    choicesEl.innerHTML = '';
    choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.label;
      btn.addEventListener('click', async ()=>{
        const myToken = genToken;
        SoundEngine.send();
        choicesEl.classList.remove('show');
        await appendMeMessage(choice.label, myToken);
        if(myToken !== genToken) return;
        setTimeout(()=> runNode(choice.next), 250);
      });
      choicesEl.appendChild(btn);
    });
    requestAnimationFrame(()=> choicesEl.classList.add('show'));
    scrollToBottom();
  }

  // ------------------------------------------------------------
  // リザルト
  // ------------------------------------------------------------
  function finishScenario(ending){
    const unlockedChar = recordEnding(currentScenario.id, ending.type);
    renderList();

    const card = $('result-card');
    card.className = 'result-card ' + ending.type;
    $('result-icon').textContent = ending.type==='success' ? '🎉' : '💀';
    $('result-kicker').textContent = ending.type==='success' ? '救出成功' : 'BAD END';
    $('result-title').textContent = ending.title;
    $('result-desc').textContent = ending.desc;
    $('result-unlock').textContent = unlockedChar ? `新着SOS：${unlockedChar.name}が解放されました` : '';
    resultModal.classList.add('show');

    if(unlockedChar){
      setTimeout(()=> showToast(unlockedChar.name+'から新着SOSが届きました'), 500);
    }
  }

  $('retry-btn').addEventListener('click', ()=>{ resultModal.classList.remove('show'); startChat(); });
  $('backlist-btn').addEventListener('click', ()=>{ resultModal.classList.remove('show'); genToken++; showScreen(listScreen); });

  // ------------------------------------------------------------
  // 初期化
  // ------------------------------------------------------------
  renderList();
  document.addEventListener('pointerdown', ()=> SoundEngine.unlock(), {once:true});

})();
</script>
