<title>既読スルー禁止</title>
<style>
  :root{
    --bg-outer:#050506;
    --frame-shadow: rgba(0,0,0,.6);
    --list-bg:#0f1115;
    --list-header:#0b0c10;
    --list-border: rgba(255,255,255,.07);
    --list-text:#f2f3f5;
    --list-sub:#8a8f98;
    --danger:#e5484d;
    --success:#2fbf71;
    --warn:#f2b134;
    --chat-bg:#849ebf;
    --chat-header:#333333;
    --bubble-them:#ffffff;
    --bubble-them-text:#141414;
    --bubble-me:#5ac463;
    --bubble-me-text:#0b2b0b;
    --accent:#06c755;
    --statusbar:#000;
    --chat-font: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
  :root[data-theme="dark"]{ color-scheme: dark; }

  /* ---- 着せ替えテーマ（#stageに data-app-theme で適用） ---- */
  #stage[data-app-theme="dark"]{
    --chat-bg:#111827; --chat-header:#0b0f17;
    --bubble-them:#1f2937; --bubble-them-text:#e5e7eb;
    --bubble-me:#7f1d1d; --bubble-me-text:#fecaca;
    --accent:#dc2626; --list-header:#0a0a0d;
  }
  #stage[data-app-theme="retro"]{
    --chat-bg:#0d150d; --chat-header:#0a100a;
    --bubble-them:#16220f; --bubble-them-text:#9ef29e;
    --bubble-me:#1d3318; --bubble-me-text:#c8ffb0;
    --accent:#6fe36f; --list-bg:#0a0f0a; --list-header:#080c08;
    --chat-font: "Courier New", ui-monospace, monospace;
  }
  #stage[data-app-theme="fancy"]{
    --chat-bg:#ffe0ef; --chat-header:#ff9ec7;
    --bubble-them:#ffffff; --bubble-them-text:#5a2340;
    --bubble-me:#ff8fc7; --bubble-me-text:#4a0f2c;
    --accent:#ff5fa8; --list-header:#1a1115;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg-outer); margin:0; font-family:var(--chat-font);
    display:flex; align-items:center; justify-content:center; min-height:100%; padding-block:20px;
  }
  #stage{
    width:100%; max-width:430px; height:min(900px, calc(100dvh - 40px));
    background:#000; border-radius:38px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px var(--frame-shadow), 0 0 0 1px rgba(255,255,255,.05);
    display:flex; flex-direction:column;
  }

  .statusbar{
    background:var(--statusbar); color:#fff; flex-shrink:0;
    padding:calc(6px + env(safe-area-inset-top,0px)) 22px 4px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; position:relative; z-index:50;
  }
  .statusbar .sb-icons{ display:flex; align-items:center; gap:5px; }

  .app-body{ position:relative; flex:1; min-height:0; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ============ ホーム画面（トーク/友だち/設定タブ） ============ */
  #home-screen{ background:var(--list-bg); }
  .home-content{ flex:1; min-height:0; position:relative; }
  .tab-panel{ position:absolute; inset:0; display:none; flex-direction:column; }
  .tab-panel.active{ display:flex; }

  .panel-header{ background:var(--list-header); padding:16px 18px 10px; border-bottom:1px solid var(--list-border); flex-shrink:0; }
  .panel-header-top{ display:flex; align-items:center; justify-content:space-between; }
  .panel-header-top h1{ color:var(--list-text); font-size:19px; font-weight:800; margin:0; }
  .reset-btn{ background:transparent; border:1px solid rgba(255,255,255,.14); color:var(--list-sub); font-size:11px; padding:6px 12px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:inherit; }
  .reset-btn:hover{ color:var(--list-text); border-color:rgba(255,255,255,.3); }
  .list-stats{ display:flex; gap:10px; margin-top:10px; }
  .stat-pill{ flex:1; background:rgba(255,255,255,.05); border:1px solid var(--list-border); border-radius:12px; padding:8px 10px; }
  .stat-pill .num{ font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stat-pill.success .num{ color:var(--success); }
  .stat-pill.bad .num{ color:var(--danger); }
  .stat-pill .lbl{ font-size:9.5px; color:var(--list-sub); margin-top:1px; }

  .thread-list, .friends-list, .settings-list{ flex:1; overflow-y:auto; }

  .thread{ width:100%; display:flex; align-items:center; gap:12px; padding:12px 18px; background:transparent; border:none; border-bottom:1px solid var(--list-border); text-align:left; cursor:pointer; font-family:inherit; }
  .thread:hover{ background:rgba(255,255,255,.04); }
  .thread-avatar{ width:46px;height:46px;border-radius:50%; flex-shrink:0; position:relative; display:flex;align-items:center;justify-content:center;font-size:20px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .thread-avatar.locked{ filter:grayscale(1) brightness(.5); }
  .unread-dot{ position:absolute; top:-2px; right:-2px; width:16px;height:16px;border-radius:50%; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; display:flex;align-items:center;justify-content:center; border:2px solid var(--list-bg); }
  .thread-body{ flex:1; min-width:0; }
  .thread-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .thread-name{ color:var(--list-text); font-size:14.5px; font-weight:700; }
  .thread-sub{ color:var(--list-sub); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge{ font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap; }
  .badge.success{ color:var(--success); border-color:rgba(47,191,113,.4); background:rgba(47,191,113,.12); }
  .badge.bad{ color:var(--danger); border-color:rgba(229,72,77,.4); background:rgba(229,72,77,.12); }
  .badge.locked{ color:#5a5e66; border-color:rgba(255,255,255,.1); background:rgba(255,255,255,.03); }

  /* ---- 友だちタブ ---- */
  .genre-group-label{ padding:12px 18px 4px; color:var(--list-sub); font-size:11px; font-weight:800; letter-spacing:.05em; }

  /* ---- 設定タブ ---- */
  .settings-list{ padding:6px 0 20px; }
  .settings-section{ padding:14px 18px 6px; }
  .settings-section-title{ color:var(--list-sub); font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:8px; }
  .theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .theme-card{
    border-radius:14px; padding:12px; cursor:pointer; border:2px solid transparent;
    background:rgba(255,255,255,.04); text-align:left; font-family:inherit;
  }
  .theme-card.selected{ border-color:var(--accent); background:rgba(255,255,255,.08); }
  .theme-swatch{ height:34px; border-radius:8px; margin-bottom:8px; display:flex; overflow:hidden; }
  .theme-swatch span{ flex:1; }
  .theme-card-name{ color:var(--list-text); font-size:12px; font-weight:700; }
  .theme-card-desc{ color:var(--list-sub); font-size:10px; margin-top:2px; }

  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 18px; border-bottom:1px solid var(--list-border); gap:12px; }
  .settings-row-label{ color:var(--list-text); font-size:13px; font-weight:600; }
  .settings-row-sub{ color:var(--list-sub); font-size:10.5px; margin-top:2px; }
  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{ position:absolute; inset:0; background:rgba(255,255,255,.15); border-radius:999px; cursor:pointer; transition:background .2s; }
  .switch input:checked + .switch-track{ background:var(--accent); }
  .switch-thumb{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
  .switch input:checked ~ .switch-thumb{ transform:translateX(18px); }
  .vol-slider{ width:100%; accent-color:var(--accent); }
  .vol-row-value{ font-size:11px; color:var(--list-sub); font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }

  .difficulty-cards{ display:flex; flex-direction:column; gap:8px; }
  .diff-card{ border-radius:14px; padding:12px 14px; cursor:pointer; border:2px solid transparent; background:rgba(255,255,255,.04); text-align:left; font-family:inherit; }
  .diff-card.selected{ border-color:var(--accent); background:rgba(255,255,255,.08); }
  .diff-card-top{ display:flex; align-items:center; justify-content:space-between; }
  .diff-card-name{ color:var(--list-text); font-size:13px; font-weight:800; }
  .diff-card-name.easy{ color:var(--success); }
  .diff-card-name.hard{ color:var(--danger); }
  .diff-card-desc{ color:var(--list-sub); font-size:10.5px; margin-top:4px; line-height:1.5; }

  .danger-btn{ width:100%; padding:12px; border-radius:12px; border:1px solid rgba(229,72,77,.4); background:rgba(229,72,77,.1); color:var(--danger); font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .danger-btn:hover{ background:rgba(229,72,77,.18); }

  /* ---- ボトムナビ ---- */
  .bottom-nav{ display:flex; flex-shrink:0; background:var(--list-header); border-top:1px solid var(--list-border); padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px)); }
  .nav-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:#5a5e66; cursor:pointer; font-family:inherit; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn span{ font-size:10px; font-weight:700; }

  /* ---------- Chat Room ---------- */
  #chat-screen{ background:var(--chat-bg); font-family:var(--chat-font); }
  .chat-header{ background:var(--chat-header); color:#fff; padding:9px 10px; display:flex; align-items:center; gap:9px; flex-shrink:0; position:relative; z-index:5; }
  .icon-btn{ background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px; opacity:.9; }
  .icon-btn:hover{ opacity:1; }
  .chat-header-avatar{ width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
  .chat-header-info{ flex:1; min-width:0; }
  .chat-header-name{ font-size:13.5px; font-weight:700; }
  .chat-header-status{ font-size:10px; margin-top:1px; color:#c7c7c7; }
  .chat-header-status.typing{ color:#8fe05a; }
  .chat-header-status.offline{ color:var(--danger); }
  .chat-header-status.waiting{ color:var(--warn); }
  .fast-toggle{ display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:999px; padding:5px 9px; font-size:10px; font-weight:700; cursor:pointer; color:#c7c7c7; flex-shrink:0; }
  .fast-toggle.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .fast-toggle[disabled]{ opacity:.35; cursor:not-allowed; }
  .diff-chip{ font-size:9px; font-weight:800; padding:4px 8px; border-radius:999px; flex-shrink:0; }
  .diff-chip.easy{ background:rgba(47,191,113,.18); color:var(--success); }
  .diff-chip.normal{ background:rgba(242,177,52,.18); color:var(--warn); }
  .diff-chip.hard{ background:rgba(229,72,77,.22); color:var(--danger); }

  .timeline{ flex:1; overflow-y:auto; padding:12px 0 6px; position:relative; z-index:1; }

  .msg-row{ display:flex; padding:0 10px; margin:5px 0; }
  .msg-row.them{ justify-content:flex-start; }
  .msg-row.me{ justify-content:flex-end; }
  .msg-avatar{ width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px; flex-shrink:0; margin-right:6px; align-self:flex-end; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .msg-wrap{ display:flex; align-items:flex-end; gap:5px; max-width:75%; }
  .msg-row.me .msg-wrap{ flex-direction:row-reverse; }
  .bubble{ position:relative; padding:8px 12px; border-radius:16px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .msg-row.them .bubble{ background:var(--bubble-them); color:var(--bubble-them-text); border-top-left-radius:3px; }
  .msg-row.me .bubble{ background:var(--bubble-me); color:var(--bubble-me-text); border-top-right-radius:3px; }
  .msg-row.them .bubble::before{ content:''; position:absolute; top:0; left:-6px; width:10px; height:10px; background:var(--bubble-them); clip-path:polygon(100% 0, 100% 100%, 0 0); }
  .msg-row.me .bubble::before{ content:''; position:absolute; top:0; right:-6px; width:10px; height:10px; background:var(--bubble-me); clip-path:polygon(0 0, 100% 0, 0 100%); }
  .msg-meta{ display:flex; flex-direction:column; font-size:9.5px; color:rgba(120,120,120,.9); flex-shrink:0; line-height:1.5; }
  .msg-row.them .msg-meta{ align-items:flex-start; }
  .msg-row.me .msg-meta{ align-items:flex-end; }
  .msg-meta .read-label.is-read{ font-weight:700; color:var(--accent); }

  .sys-row{ display:flex; justify-content:center; padding:9px 24px; }
  .sys-inner{ display:flex; flex-direction:column; align-items:center; gap:7px; max-width:88%; }
  .sys-text{ font-size:10.5px; color:rgba(20,20,20,.65); background:rgba(255,255,255,.55); padding:4px 12px; border-radius:999px; text-align:center; }

  .eerie-frame{ width:100%; max-width:200px; border-radius:11px; overflow:hidden; border:1px solid rgba(0,0,0,.4); box-shadow:0 6px 18px rgba(0,0,0,.35); animation: flicker 2.6s linear infinite; }
  .eerie-frame svg{ display:block; width:100%; aspect-ratio:3/2; background:#000; }
  .eerie-caption{ background:rgba(0,0,0,.82); color:#9aa0a8; font-size:9px; font-family:ui-monospace,monospace; padding:4px 8px; }

  .glitch{ position:relative; display:inline-block; color:#ff3b3b; text-shadow:2px 0 #00e5ff, -2px 0 #ff00c8; animation: glitchJitter .13s infinite steps(2); }

  .typing-row{ display:flex; padding:0 10px; margin:5px 0; align-items:flex-end; }
  .typing-bubble{ background:var(--bubble-them); border-radius:16px; border-top-left-radius:3px; padding:10px 14px; display:flex; gap:4px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .typing-dot{ width:6px;height:6px;border-radius:50%; background:currentColor; color:var(--bubble-them-text); opacity:.5; animation:bounceDot 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2){ animation-delay:.15s; }
  .typing-dot:nth-child(3){ animation-delay:.3s; }

  .action-timer-row{ display:flex; justify-content:center; padding:14px 22px; }
  .action-timer{ width:100%; max-width:280px; background:rgba(10,10,14,.72); border:1px solid rgba(255,80,80,.35); border-radius:16px; padding:14px 16px; backdrop-filter:blur(2px); }
  .at-label{ color:#ff8f8f; font-size:11.5px; font-weight:700; text-align:center; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .at-label .dot{ width:6px;height:6px;border-radius:50%; background:#ff4d4d; animation:pulseDot 1s infinite; }
  .at-bar-track{ height:6px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .at-bar-fill{ height:100%; background:linear-gradient(90deg,#ff4d4d,#ff8f4d); border-radius:999px; transition:width .1s linear; }
  .at-count{ text-align:center; color:#fff; font-size:19px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; }

  .input-bar{ flex-shrink:0; background:#f1f1f1; border-top:1px solid rgba(0,0,0,.08); padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:7px; position:relative; z-index:2; }
  .input-bar .ib-icon{ width:26px;height:26px; flex-shrink:0; display:flex;align-items:center;justify-content:center; color:#8b8f96; }
  .input-bar .ib-field{ flex:1; background:#fff; border-radius:18px; padding:8px 14px; font-size:12.5px; color:#a8adb5; border:1px solid rgba(0,0,0,.06); }

  .choices{ position:absolute; left:0; right:0; bottom:0; z-index:3; background:#eef1f4; border-top:1px solid rgba(0,0,0,.08); padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1); }
  .choices.show{ transform:translateY(0); }
  .choice-timer{ display:flex; align-items:center; gap:8px; padding:2px 2px 4px; }
  .choice-timer-label{ font-size:10.5px; color:var(--danger); font-weight:800; flex-shrink:0; }
  .choice-timer-track{ flex:1; height:5px; border-radius:999px; background:rgba(0,0,0,.1); overflow:hidden; }
  .choice-timer-fill{ height:100%; background:var(--danger); border-radius:999px; transition:width .1s linear; }
  .choice-btn{ width:100%; text-align:left; padding:12px 14px; border-radius:14px; background:#fff; border:1px solid rgba(0,0,0,.06); box-shadow:0 2px 6px rgba(0,0,0,.08); font-size:13px; color:#1a1a1a; font-weight:600; cursor:pointer; font-family:inherit; transition:transform .1s ease, background .15s ease; display:flex; align-items:center; gap:8px; }
  .choice-btn:hover{ background:#fafafa; }
  .choice-btn:active{ transform:scale(.98); }
  .risk-hint{ font-size:12px; flex-shrink:0; opacity:.6; }

  .call-flash{ position:absolute; inset:0; z-index:30; background:#000; display:flex; align-items:center; justify-content:center; animation: flashRed .5s ease-in-out 2; }
  .call-flash span{ color:var(--danger); font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.08em; }

  .noise-overlay{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; mix-blend-mode:overlay; }
  #chat-screen.hard-mode .noise-overlay{ opacity:.5; animation: noiseShift .3s steps(2) infinite; background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px); }
  @keyframes noiseShift{ 0%{ transform:translateY(0);} 100%{ transform:translateY(3px);} }

  #warn-modal{ position:absolute; inset:0; z-index:45; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.75); }
  #warn-modal.show{ display:flex; }
  .warn-card{ width:100%; max-width:300px; border-radius:18px; padding:22px 20px; text-align:center; background:#1a1215; border:1px solid rgba(242,177,52,.4); }
  .warn-card .wc-icon{ font-size:32px; margin-bottom:8px; }
  .warn-card .wc-title{ color:var(--warn); font-size:15px; font-weight:800; margin-bottom:8px; }
  .warn-card .wc-desc{ color:#c9ccd1; font-size:12px; line-height:1.6; margin-bottom:16px; }
  .warn-actions{ display:flex; flex-direction:column; gap:8px; }
  .warn-btn{ width:100%; padding:11px; border-radius:999px; border:none; cursor:pointer; font-size:12.5px; font-weight:700; font-family:inherit; }
  .warn-btn.cancel{ background:rgba(255,255,255,.1); color:#fff; }
  .warn-btn.proceed{ background:var(--danger); color:#fff; }

  /* ---------- Result Modal ---------- */
  #result-modal{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.82); }
  #result-modal.show{ display:flex; }
  .result-card{ width:100%; max-width:310px; border-radius:20px; padding:26px 22px; text-align:center; background:#111318; border:1px solid rgba(255,255,255,.08); }
  .result-card.success{ border-color:rgba(47,191,113,.35); }
  .result-card.bad{ border-color:rgba(229,72,77,.4); }
  .result-icon{ font-size:42px; margin-bottom:6px; }
  .result-kicker{ font-size:11.5px; font-weight:800; letter-spacing:.08em; margin-bottom:4px; }
  .result-card.success .result-kicker{ color:var(--success); }
  .result-card.bad .result-kicker{ color:var(--danger); }
  .result-title{ color:#fff; font-size:16.5px; font-weight:800; margin-bottom:9px; }
  .result-desc{ color:#a8adb5; font-size:12.5px; line-height:1.7; margin-bottom:12px; }
  .result-unlock{ font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:16px; min-height:1px; }
  .result-actions{ display:flex; flex-direction:column; gap:9px; }
  .result-btn{ width:100%; padding:12px; border-radius:999px; border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; }
  .result-btn.retry{ background:rgba(255,255,255,.1); color:#fff; }
  .result-btn.retry:hover{ background:rgba(255,255,255,.16); }
  .result-btn.back{ background:var(--accent); color:#fff; }
  .result-btn.back:hover{ filter:brightness(1.08); }

  .toast{ position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-140%); background:#161a20; color:#fff; padding:10px 16px; border-radius:12px; font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1); z-index:60; white-space:nowrap; transition:transform .35s cubic-bezier(.34,1.56,.64,1); display:flex; align-items:center; gap:8px; }
  .toast.show{ transform:translateX(-50%) translateY(0); }

  @keyframes shake{ 0%,100%{transform:translate(0,0);} 10%{transform:translate(-2px,1px);} 20%{transform:translate(2px,-1px);} 30%{transform:translate(-3px,0);} 40%{transform:translate(3px,1px);} 50%{transform:translate(-1px,-2px);} 60%{transform:translate(1px,2px);} 70%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} 90%{transform:translate(-1px,0);} }

  @keyframes flashRed{ 0%,100%{background-color:transparent;} 50%{background-color:rgba(220,38,38,.32);} }
  .fx-flash{ animation:flashRed .5s ease-in-out 2; }
  @keyframes flicker{ 0%,100%{opacity:1;} 45%{opacity:1;} 46%{opacity:.3;} 47%{opacity:1;} 48%{opacity:.2;} 49%{opacity:1;} }
  @keyframes glitchJitter{ 0%{transform:translate(0,0);} 25%{transform:translate(-1px,1px);} 50%{transform:translate(1px,-1px);} 75%{transform:translate(-1px,-1px);} 100%{transform:translate(1px,1px);} }

  @media (prefers-reduced-motion: reduce){
    .fx-shake,.fx-shake-hard,.fx-flash,.eerie-frame,.glitch,.typing-dot,.at-label .dot,.noise-overlay{ animation:none !important; }

<script>
(function(){
  "use strict";

  // ============================================================
  // 0. ステータスバー時計
  // ============================================================
  function tickClock(){
    const d = new Date();
    document.getElementById('sb-time').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  }
  tickClock(); setInterval(tickClock, 15000);

  // ============================================================
  // 1. 設定 (Settings) — localStorageに独立保存
  // ============================================================
  const SETTINGS_KEY = 'line-horror-settings-v1';
  const THEMES = [
    {id:'classic', name:'LINEクラシック', desc:'標準の水色グレー×グリーン', colors:['#849ebf','#5ac463']},
    {id:'dark', name:'ダーク・ブラッド', desc:'漆黒×ブラッドレッド', colors:['#111827','#7f1d1d']},
    {id:'retro', name:'レトロガラケー', desc:'緑がかったモノクロ液晶', colors:['#0d150d','#1d3318']},
    {id:'fancy', name:'ファンシーピンク', desc:'可愛いのにホラーな狂気のギャップ', colors:['#ffe0ef','#ff8fc7']},
  ];
  const DIFFICULTIES = [
    {id:'easy', name:'EASY（簡単）', desc:'潜伏タイマー半減・早送り常時可・危険選択肢にヒント表示、初回は選び直しOK。制限時間なし。'},
    {id:'normal', name:'NORMAL（普通）', desc:'標準の潜伏時間・早送り利用可。ヒントなし、トラップ選択肢は即BADフラグ。'},
    {id:'hard', name:'HARD（極限ホラー）', desc:'リアルタイム潜伏、早送り不可。選択肢出現から25秒以内に返信しないと「既読スルー」で即BAD。画面ノイズ激化。'},
  ];

  function defaultSettings(){
    return { theme:'classic', masterVolume:0.7, seEnabled:true, horrorAudioEnabled:true, difficulty:'normal' };
  }
  function loadSettings(){
    try{
      const raw = localStorage.getItem(SETTINGS_KEY);
      if(!raw) return defaultSettings();
      return Object.assign(defaultSettings(), JSON.parse(raw));
    }catch(e){ return defaultSettings(); }
  }
  function persistSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
  let settings = loadSettings();

  function applyTheme(){
    document.getElementById('stage').setAttribute('data-app-theme', settings.theme);
  }

  // ============================================================
  // 2. サウンドエンジン（音量・SE/環境音トグル対応）
  // ============================================================
  const SoundEngine = (function(){
    let ctx=null, master=null;
    function ensure(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = settings.masterVolume; master.connect(ctx.destination);
      }
      if(ctx.state==='suspended') ctx.resume();
      return ctx;
    }
    function unlock(){ try{ ensure(); }catch(e){} }
    function setVolume(v){ if(master) master.gain.value = v; }
    function tone(freq,start,dur,opt){
      opt=opt||{};
      const c=ensure(); const osc=c.createOscillator(); const gain=c.createGain();
      osc.type=opt.type||'sine'; osc.frequency.setValueAtTime(freq,start);
      if(opt.freqEnd!==undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(opt.freqEnd,1), start+dur);
      const peak=opt.gain!==undefined?opt.gain:.3, attack=opt.attack!==undefined?opt.attack:.01, release=opt.release!==undefined?opt.release:dur*.6;
      gain.gain.setValueAtTime(.0001,start); gain.gain.exponentialRampToValueAtTime(peak,start+attack); gain.gain.exponentialRampToValueAtTime(.0001,start+attack+release);
      osc.connect(gain); gain.connect(master); osc.start(start); osc.stop(start+dur+.05);
    }
    function noiseBuffer(dur){
      const c=ensure(); const size=Math.floor(c.sampleRate*dur); const buf=c.createBuffer(1,size,c.sampleRate); const data=buf.getChannelData(0);
      for(let i=0;i<size;i++) data[i]=Math.random()*2-1;
      return buf;
    }
    return {
      unlock, setVolume,
      receive(){ if(!settings.seEnabled) return; const c=ensure(),now=c.currentTime; tone(880,now,.11,{gain:.26,attack:.004}); tone(1760,now+.08,.14,{gain:.22,attack:.004}); },
      send(){ if(!settings.seEnabled) return; const c=ensure(),now=c.currentTime; tone(700,now,.07,{freqEnd:900,gain:.17,attack:.004}); },
      readChime(){ if(!settings.seEnabled) return; const c=ensure(),now=c.currentTime; tone(1500,now,.09,{gain:.1,attack:.006}); },
      heartbeat(){ if(!settings.horrorAudioEnabled) return; const c=ensure(),now=c.currentTime; tone(50,now,.16,{gain:.5,freqEnd:35,attack:.01,release:.11}); tone(48,now+.17,.16,{gain:.4,freqEnd:30,attack:.01,release:.11}); },
      fearNoise(dur){ if(!settings.horrorAudioEnabled) return; dur=dur||.8; const c=ensure(),now=c.currentTime;
        const noise=c.createBufferSource(); noise.buffer=noiseBuffer(dur);
        const ng=c.createGain(); ng.gain.setValueAtTime(.0001,now); ng.gain.exponentialRampToValueAtTime(.18,now+.05); ng.gain.exponentialRampToValueAtTime(.0001,now+dur);
        const filt=c.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=1200; filt.Q.value=.7;
        noise.connect(filt); filt.connect(ng); ng.connect(master); noise.start(now); noise.stop(now+dur);
        tone(185,now,dur,{type:'sawtooth',gain:.12,attack:.02,release:dur*.8}); tone(196,now+.02,dur,{type:'sawtooth',gain:.1,attack:.02,release:dur*.8});
      },
      callEnd(){ if(!settings.horrorAudioEnabled) return; const c=ensure(),now=c.currentTime;
        const noise=c.createBufferSource(); noise.buffer=noiseBuffer(.6);
        const g=c.createGain(); g.gain.setValueAtTime(.3,now); g.gain.exponentialRampToValueAtTime(.0001,now+.6);
        const filt=c.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=800;
        noise.connect(filt); filt.connect(g); g.connect(master); noise.start(now); noise.stop(now+.6);
        tone(320,now,.3,{type:'square',gain:.15,freqEnd:60});
      },
      alarm(){ if(!settings.horrorAudioEnabled) return; const c=ensure(),now=c.currentTime; for(let i=0;i<4;i++){ const t=now+i*.3; tone(880,t,.15,{type:'square',gain:.2}); tone(660,t+.15,.15,{type:'square',gain:.2}); } },
      testPing(){ const c=ensure(),now=c.currentTime; tone(880,now,.11,{gain:.26,attack:.004}); tone(1760,now+.08,.14,{gain:.22,attack:.004}); },
    };
  })();

  function playSound(name){
    switch(name){
      case 'receive': SoundEngine.receive(); break;
      case 'send': SoundEngine.send(); break;
      case 'readChime': SoundEngine.readChime(); break;
      case 'heartbeat': SoundEngine.heartbeat(); break;
      case 'noise': SoundEngine.fearNoise(); break;
      case 'callEnd': SoundEngine.callEnd(); break;
      case 'alarm': SoundEngine.alarm(); break;
    }
  }

  // ============================================================
  // 3. 難易度に応じた時間制御
  // ============================================================
  let FAST = false;
  function fastAllowed(){ return settings.difficulty !== 'hard'; }
  function wait(ms){
    const useFast = FAST && fastAllowed();
    const real = useFast ? Math.min(Math.max(ms*0.06, 40), 350) : ms;
    return new Promise(r=>setTimeout(r, real));
  }
  function readDelay(){ return 1500 + Math.random()*1500; }
  function typingDelay(){ return 2000 + Math.random()*3000; }
  function scaledActionSeconds(base){
    if(settings.difficulty === 'easy') return Math.max(5, Math.round(base*0.5));
    return base;
  }

  // ============================================================
  // 4. 不穏な画像プレースホルダー
  // ============================================================
  function eerieSvg(kind){
    const grad = (id,c1,c2)=>`<radialGradient id="${id}" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></radialGradient>`;
    switch(kind){
      case 'doorscope': return `<svg viewBox="0 0 300 200"><defs>${grad('g1','#3a3a3a','#000')}</defs><rect width="300" height="200" fill="#000"/><circle cx="150" cy="100" r="90" fill="url(#g1)"/><circle cx="150" cy="100" r="92" fill="none" stroke="#111" stroke-width="14"/></svg>`;
      case 'eyes': return `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#050505"/><rect x="0" y="120" width="300" height="10" fill="#161616"/><ellipse cx="130" cy="115" rx="10" ry="6" fill="#e8e2c8"/><ellipse cx="166" cy="115" rx="10" ry="6" fill="#e8e2c8"/><circle cx="131" cy="115" r="3" fill="#1a1200"/><circle cx="167" cy="115" r="3" fill="#1a1200"/></svg>`;
      case 'cctv': return `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#0a0f0a"/>${Array.from({length:10}).map((_,i)=>`<rect y="${i*20}" width="300" height="1" fill="#00ff66" opacity=".06"/>`).join('')}<rect x="150" y="40" width="70" height="60" fill="none" stroke="#00ff66" stroke-width="1.3" opacity=".55"/><text x="14" y="190" fill="#00ff66" font-size="12" opacity=".7" font-family="monospace">REC ● CAM</text></svg>`;
      case 'handprints': { const prints=[{x:40,y:60,r:-15},{x:120,y:40,r:20},{x:200,y:70,r:-5},{x:80,y:120,r:10},{x:220,y:130,r:-25}];
        return `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#141414"/>${prints.map(p=>`<g transform="translate(${p.x},${p.y}) rotate(${p.r})" opacity=".55"><ellipse cx="0" cy="14" rx="9" ry="13" fill="#c9d6e0"/><ellipse cx="-11" cy="-2" rx="3" ry="9" fill="#c9d6e0"/><ellipse cx="-4" cy="-8" rx="3" ry="10" fill="#c9d6e0"/><ellipse cx="4" cy="-8" rx="3" ry="10" fill="#c9d6e0"/><ellipse cx="11" cy="-2" rx="3" ry="9" fill="#c9d6e0"/></g>`).join('')}</svg>`; }
      case 'tunnel': return `<svg viewBox="0 0 300 200"><defs>${grad('g2','#5a5a5a','#050505')}</defs><rect width="300" height="200" fill="#020202"/><ellipse cx="150" cy="90" rx="110" ry="80" fill="url(#g2)" opacity=".9"/><path d="M60 200 Q150 60 240 200 Z" fill="#000" opacity=".85"/></svg>`;
      case 'shadow': return `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#0a0a0a"/><ellipse cx="150" cy="140" rx="34" ry="60" fill="#000"/><ellipse cx="150" cy="70" rx="20" ry="22" fill="#000"/></svg>`;
      case 'static': return `<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#111"/>${Array.from({length:60}).map(()=>`<rect x="${Math.random()*300}" y="${Math.random()*200}" width="${2+Math.random()*10}" height="1.5" fill="#888" opacity="${Math.random()*.6}"/>`).join('')}</svg>`;
      default: return '';
    }
  }

  // ============================================================
  // 5. キャラクター・シナリオデータ（30人）※riskフィールド追加
  // ============================================================
  const COLORS = ['#f472b6','#38bdf8','#facc15','#a78bfa','#fb923c','#4ade80','#f87171','#22d3ee','#e879f9','#fbbf24'];
  function colorFor(i){ return COLORS[i % COLORS.length]; }

  const char01 = {
    id:'char01', name:'アオイ', role:'後輩', genre:'人コワ・サスペンス', title:'真夜中のドアスコープ',
    emoji:'🌙', color:colorFor(0), startNodeId:'start',
    nodes:{
      start:{ messages:[
          {sender:'them', text:'先輩起きてますか？'},
          {sender:'them', text:'変な時間にすいません'},
          {sender:'them', text:'うちの部屋のドア、さっきからずっとガチャガチャされてて…', effect:'shake'},
        ], choices:[
          {label:'誰か確かめろ、声出してみろ', next:'c1_bad_voice', risk:'danger'},
          {label:'絶対に声出すな。鍵はかかってるか？', next:'mid', risk:'safe'},
        ] },
      c1_bad_voice:{ messages:[

  const SAVE_KEY = 'line-horror-save-v2';
  function defaultSave(){ return { unlocked: scenarios.slice(0,3).map(s=>s.id), everCleared:[], everBad:[], latestStatus:{} }; }
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return defaultSave();
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.unlocked)) return defaultSave();
      return Object.assign(defaultSave(), parsed);
    }catch(e){ return defaultSave(); }
  }
  function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
  let save = loadSave();
  function isUnlocked(id){ return save.unlocked.indexOf(id) !== -1; }
  function unlockNext(){ const next = scenarios.find(s => save.unlocked.indexOf(s.id) === -1); if(next){ save.unlocked.push(next.id); return next; } return null; }
  function recordEnding(id, type){
    save.latestStatus[id] = type;
    let unlockedChar = null;
    if(type==='success' && save.everCleared.indexOf(id)===-1){ save.everCleared.push(id); unlockedChar = unlockNext(); }
    if(type==='bad' && save.everBad.indexOf(id)===-1){ save.everBad.push(id); }
    persist();
    return unlockedChar;
  }

  function renderList(){
    $('stat-cleared').textContent = save.everCleared.length + '/' + scenarios.length;
    $('stat-bad').textContent = save.everBad.length + '/' + scenarios.length;
    threadList.innerHTML = '';
    scenarios.forEach(sc=>{
      const unlocked = isUnlocked(sc.id);
      const status = save.latestStatus[sc.id];
      const btn = document.createElement('button');
      btn.className = 'thread';
      if(!unlocked) btn.style.opacity = '.45';
      btn.innerHTML = `
        <div class="thread-avatar ${unlocked?'':'locked'}" style="background:${sc.color}">
          ${unlocked ? sc.emoji : '🔒'}
          ${unlocked && !status ? '<span class="unread-dot">1</span>' : ''}
        </div>
        <div class="thread-body">
          <div class="thread-top"><span class="thread-name">${unlocked ? sc.name : '???'}</span>${badgeHtml(unlocked, status)}</div>
          <div class="thread-sub">${unlocked ? (sc.title+' ─ '+sc.genre) : 'まだ解放されていません'}</div>
        </div>`;
      if(unlocked) btn.addEventListener('click', ()=> openScenario(sc.id));
      else btn.style.cursor = 'default';
      threadList.appendChild(btn);

    if(!unlocked) return '<span class="badge locked">未解放</span>';
    if(status==='success') return '<span class="badge success">救出成功</span>';
    if(status==='bad') return '<span class="badge bad">音信不通</span>';
    return '';
  }

  // ------------------------------------------------------------
  // 友だちタブ（ジャンル別図鑑）
  // ------------------------------------------------------------
  function renderFriends(){
    friendsList.innerHTML = '';
    const genres = [];
    scenarios.forEach(sc=>{ if(genres.indexOf(sc.genre)===-1) genres.push(sc.genre); });
    genres.forEach(genre=>{
      const label = document.createElement('div');
      label.className = 'genre-group-label';
      label.textContent = genre;
      friendsList.appendChild(label);
      scenarios.filter(s=>s.genre===genre).forEach(sc=>{
        const unlocked = isUnlocked(sc.id);
        const status = save.latestStatus[sc.id];
        const btn = document.createElement('button');
        btn.className = 'thread';
        if(!unlocked) btn.style.opacity = '.45';
        btn.innerHTML = `
          <div class="thread-avatar ${unlocked?'':'locked'}" style="background:${sc.color}">${unlocked ? sc.emoji : '🔒'}</div>
          <div class="thread-body">
            <div class="thread-top"><span class="thread-name">${unlocked ? sc.name : '???'}</span>${badgeHtml(unlocked, status)}</div>
            <div class="thread-sub">${unlocked ? sc.title : '救出成功すると新たなSOSが届きます'}</div>
          </div>`;
        if(unlocked) btn.addEventListener('click', ()=> openScenario(sc.id));
        else btn.style.cursor = 'default';
        friendsList.appendChild(btn);
      });
    });
  }

  // ------------------------------------------------------------
  // 設定タブ
  // ------------------------------------------------------------
  function renderSettings(){
    settingsList.innerHTML = `
      <div class="settings-section">
        <div class="settings-section-title">着せ替え</div>
        <div class="theme-grid" id="theme-grid"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">音量・サウンド</div>
      </div>
      <div class="settings-row">
        <div style="flex:1">
          <div class="settings-row-label">マスター音量</div>
          <input type="range" min="0" max="100" value="${Math.round(settings.masterVolume*100)}" class="vol-slider" id="vol-slider">
        </div>
        <span class="vol-row-value" id="vol-value">${Math.round(settings.masterVolume*100)}%</span>
      </div>
      <div class="settings-row">
        <div><div class="settings-row-label">効果音（受信音・送信音）</div><div class="settings-row-sub">ピコン♪ ポッ</div></div>
        <label class="switch"><input type="checkbox" id="se-toggle" ${settings.seEnabled?'checked':''}><span class="switch-track"></span><span class="switch-thumb"></span></label>
      </div>
      <div class="settings-row" style="border-bottom:none;">
        <div><div class="settings-row-label">環境音・ホラー演出音</div><div class="settings-row-sub">心音パルス・グリッチノイズ</div></div>
        <label class="switch"><input type="checkbox" id="horror-toggle" ${settings.horrorAudioEnabled?'checked':''}><span class="switch-track"></span><span class="switch-thumb"></span></label>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">難易度</div>
        <div class="difficulty-cards" id="diff-cards"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">データ管理</div>
        <button class="danger-btn" id="reset-progress-btn">救出記録とバッドエンド記録をリセットする</button>
      </div>
    `;

    const themeGrid = $('theme-grid');
    THEMES.forEach(t=>{
      const card = document.createElement('button');
      card.className = 'theme-card' + (settings.theme===t.id ? ' selected' : '');
      card.innerHTML = `
        <div class="theme-swatch"><span style="background:${t.colors[0]}"></span><span style="background:${t.colors[1]}"></span></div>
        <div class="theme-card-name">${t.name}</div>
        <div class="theme-card-desc">${t.desc}</div>`;
      card.addEventListener('click', ()=>{
        settings.theme = t.id; persistSettings(); applyTheme(); renderSettings();
      });
      themeGrid.appendChild(card);
    });

    const diffCards = $('diff-cards');
    DIFFICULTIES.forEach(d=>{
      const card = document.createElement('button');
      card.className = 'diff-card' + (settings.difficulty===d.id ? ' selected' : '');
      card.innerHTML = `
        <div class="diff-card-top"><span class="diff-card-name ${d.id}">${d.name}</span></div>
        <div class="diff-card-desc">${d.desc}</div>`;
      card.addEventListener('click', ()=>{ settings.difficulty = d.id; persistSettings(); renderSettings(); });
      diffCards.appendChild(card);
    });

    $('vol-slider').addEventListener('input', (e)=>{
      const v = e.target.value/100;
      settings.masterVolume = v;
      SoundEngine.setVolume(v);
      $('vol-value').textContent = e.target.value + '%';
    });
    $('vol-slider').addEventListener('change', ()=>{ persistSettings(); SoundEngine.testPing(); });
    $('se-toggle').addEventListener('change', (e)=>{ settings.seEnabled = e.target.checked; persistSettings(); if(e.target.checked) SoundEngine.testPing(); });
    $('horror-toggle').addEventListener('change', (e)=>{ settings.horrorAudioEnabled = e.target.checked; persistSettings(); });

    $('reset-progress-btn').addEventListener('click', ()=>{
      if(confirm('すべてのプレイ状況をリセットします。よろしいですか？')){
        save = defaultSave(); persist(); renderList();
        alert('リセットしました');
      }
    });
  }

  function showToast(text){
    const el = document.createElement('div'); el.className='toast'; el.innerHTML = `<span>📩</span><span>${text}</span>`;
    toastHolder.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 400); }, 2600);
  }

  // ------------------------------------------------------------
  // 画面遷移
  // ------------------------------------------------------------
  function showScreen(el){ [homeScreen, chatScreen].forEach(s=>s.classList.remove('active')); el.classList.add('active'); }

  function openScenario(id){
    SoundEngine.unlock();
    currentScenario = getScenario(id);
    easyWarningUsed = false;
    renderList();
    startChat();
    showScreen(chatScreen);
  }

  $('back-btn').addEventListener('click', ()=>{ genToken++; clearChoiceTimeout(); showScreen(homeScreen); });

  function handleCallTap(){
    SoundEngine.callEnd();
    const flash = document.createElement('div'); flash.className='call-flash'; flash.innerHTML='<span>通話が強制切断されました</span>';
    callFlashHolder.appendChild(flash); setTimeout(()=> flash.remove(), 800);
  }
  $('call-btn').addEventListener('click', handleCallTap);

  // ------------------------------------------------------------
  // チャット進行エンジン
  // ------------------------------------------------------------
  function startChat(){
    timelineEl.innerHTML = '';
    choicesEl.classList.remove('show');
    choicesEl.innerHTML = '';
    chatAvatar.style.background = currentScenario.color;
    chatAvatar.textContent = currentScenario.emoji;
    chatName.textContent = currentScenario.name;
    setChatStatus('オンライン');

    const diffMeta = DIFFICULTIES.find(d=>d.id===settings.difficulty);
    diffChip.textContent = diffMeta ? diffMeta.name.split('（')[0] : '';
    diffChip.className = 'diff-chip ' + settings.difficulty;

    FAST = false;
    fastToggle.classList.remove('on');
    fastToggle.disabled = !fastAllowed();
    fastToggle.style.display = fastAllowed() ? '' : 'none';
    chatScreen.classList.toggle('hard-mode', settings.difficulty==='hard');

    runNode(currentScenario.startNodeId);
  }

  function setChatStatus(text, cls){ chatStatus.textContent = text; chatStatus.className = 'chat-header-status' + (cls?' '+cls:''); }
  function nowLabel(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  function triggerScreenEffect(effect){
    const cls = effect==='shake' ? 'fx-shake' : effect==='shake-hard' ? 'fx-shake-hard' : effect==='flash' ? 'fx-flash' : null;
    if(!cls) return;
    chatScreen.classList.remove('fx-shake','fx-shake-hard','fx-flash');
    void chatScreen.offsetWidth;
    chatScreen.classList.add(cls);
    setTimeout(()=> chatScreen.classList.remove(cls), 650);
  }

  function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function scrollToBottom(){ timelineEl.scrollTop = timelineEl.scrollHeight; }

  function appendSystemMessage(msg){
    const row = document.createElement('div'); row.className='sys-row';
    let inner = '<div class="sys-inner">';
    if(msg.text) inner += `<span class="sys-text">${escapeHtml(msg.text)}</span>`;
    if(msg.image){ inner += `<div class="eerie-frame">${eerieSvg(msg.image.kind)}</div>`; if(msg.image.caption) inner += `<div class="eerie-caption">${escapeHtml(msg.image.caption)}</div>`; }
    inner += '</div>'; row.innerHTML = inner; timelineEl.appendChild(row);
  }
  function appendThemMessage(msg){
    const time = nowLabel();
    const row = document.createElement('div'); row.className='msg-row them';
    const textHtml = msg.glitch ? `<span class="glitch">${escapeHtml(msg.text)}</span>` : escapeHtml(msg.text);
    row.innerHTML = `<div class="msg-avatar" style="background:${currentScenario.color}">${currentScenario.emoji}</div>
      <div class="msg-wrap"><div class="bubble">${textHtml}</div><div class="msg-meta"><span>${time}</span></div></div>`;
    timelineEl.appendChild(row);
  }
  async function appendMeMessage(text, myToken){
    const time = nowLabel();
    const row = document.createElement('div'); row.className='msg-row me';
    const readId = 'read-' + Math.random().toString(36).slice(2);
    row.innerHTML = `<div class="msg-wrap"><div class="bubble">${escapeHtml(text)}</div><div class="msg-meta"><span class="read-label" id="${readId}">未読</span><span>${time}</span></div></div>`;
    timelineEl.appendChild(row); scrollToBottom();
    await wait(readDelay());
    if(myToken !== genToken) return;
    const label = document.getElementById(readId);
    if(label){ label.textContent='既読'; label.classList.add('is-read'); }
    playSound('readChime');
  }
  function showTyping(show){
    let row = document.getElementById('typing-row');
    if(show){
      if(row) return;
      row = document.createElement('div'); row.id='typing-row'; row.className='typing-row';
      row.innerHTML = `<div class="msg-avatar" style="background:${currentScenario.color}">${currentScenario.emoji}</div>
        <div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
      timelineEl.appendChild(row); scrollToBottom();
    } else if(row){ row.remove(); }
  }

  function runActionTimer(baseSeconds, label, myToken){
    const seconds = scaledActionSeconds(baseSeconds);
    return new Promise(resolve=>{
      const useFast = FAST && fastAllowed();
      const totalMs = useFast ? 1400 : seconds*1000;
      const row = document.createElement('div'); row.className='action-timer-row';
      row.innerHTML = `<div class="action-timer">
          <div class="at-label"><span class="dot"></span><span>${escapeHtml(label)}</span></div>
          <div class="at-bar-track"><div class="at-bar-fill" id="at-fill" style="width:100%"></div></div>
          <div class="at-count" id="at-count">${useFast? '' : seconds}</div>
        </div>`;
      timelineEl.appendChild(row); scrollToBottom();
      setChatStatus(label, 'waiting');
      const fill = row.querySelector('#at-fill'), countEl = row.querySelector('#at-count');
      const start = performance.now();
      function tick(now){
        if(myToken !== genToken) return;
        const elapsed = now-start, remain = Math.max(0, totalMs-elapsed), pct = Math.max(0, 100*remain/totalMs);
        fill.style.width = pct+'%';
        if(!useFast) countEl.textContent = Math.ceil(remain/1000)+'秒';
        if(remain<=0){ row.remove(); resolve(); return; }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  async function runNode(nodeId){
    const myToken = ++genToken;
    const node = currentScenario.nodes[nodeId];
    if(!node) return;

    for(const msg of node.messages){
      if(myToken !== genToken) return;

      if(msg.type === 'actionWait'){
        await runActionTimer(msg.seconds, msg.label, myToken);
        if(myToken !== genToken) return;
        setChatStatus('オンライン');
        await wait(300);
        playSound('receive');
        continue;
      }

      if(msg.sender === 'them'){
        setChatStatus('入力中...', 'typing');
        showTyping(true);
        await wait(msg.delay || typingDelay());
        if(myToken !== genToken) return;
        showTyping(false);
        setChatStatus('オンライン');
        appendThemMessage(msg);
        playSound(msg.sound || 'receive');
        if(msg.effect) triggerScreenEffect(msg.effect);
        scrollToBottom();
        await wait(200);
      } else if(msg.sender === 'system'){
        if(msg.delay) await wait(msg.delay);
        if(myToken !== genToken) return;
        appendSystemMessage(msg);
        if(msg.sound) playSound(msg.sound);
        if(msg.effect) triggerScreenEffect(msg.effect);
        scrollToBottom();
        await wait(200);
      } else if(msg.sender === 'me'){
        await appendMeMessage(msg.text, myToken);
        if(myToken !== genToken) return;
      }
      if(myToken !== genToken) return;
    }

    if(myToken !== genToken) return;

    if(node.ending){
      setChatStatus('オフライン', 'offline');
      await wait(500);
      if(myToken !== genToken) return;
      finishScenario(node.ending);
      return;
    }

    if(node.choices && node.choices.length){
      renderChoices(node.choices, myToken);
      return;
    }

    if(node.autoNext){
      await wait(node.autoDelay || 1000);
      if(myToken !== genToken) return;
      runNode(node.autoNext);
    }
  }

  function clearChoiceTimeout(){
    if(choiceTimeoutHandle){ clearInterval(choiceTimeoutHandle); choiceTimeoutHandle = null; }
    const row = document.getElementById('choice-timer-row');
    if(row) row.remove();
  }

  function renderChoices(choices, myToken){
    choicesEl.innerHTML = '';

    if(settings.difficulty === 'hard'){
      const timerRow = document.createElement('div');
      timerRow.className = 'choice-timer'; timerRow.id = 'choice-timer-row';
      timerRow.innerHTML = `<span class="choice-timer-label">残り25秒</span><div class="choice-timer-track"><div class="choice-timer-fill" id="choice-timer-fill" style="width:100%"></div></div>`;
      choicesEl.appendChild(timerRow);
      const fill = timerRow.querySelector('#choice-timer-fill');
      const label = timerRow.querySelector('.choice-timer-label');
      const totalMs = 25000;
      const start = performance.now();
      choiceTimeoutHandle = setInterval(()=>{
        if(myToken !== genToken){ clearChoiceTimeout(); return; }
        const remain = Math.max(0, totalMs - (performance.now()-start));
        fill.style.width = (100*remain/totalMs)+'%';
        label.textContent = '残り'+Math.ceil(remain/1000)+'秒';
        if(remain <= 0){
          clearChoiceTimeout();
          choicesEl.classList.remove('show');
          finishScenario({type:'bad', title:'既読スルー', desc:'制限時間内に返信できなかった。既読だけがついたまま、相手の反応は途絶えた。'});
        }
      }, 100);
    }

    choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      const hint = (settings.difficulty==='easy' && choice.risk) ? `<span class="risk-hint">${choice.risk==='danger'?'🔴':'🟢'}</span>` : '';
      btn.innerHTML = `${hint}<span>${escapeHtml(choice.label)}</span>`;
      btn.addEventListener('click', ()=> handleChoiceClick(choice, myToken));
      choicesEl.appendChild(btn);
    });
    requestAnimationFrame(()=> choicesEl.classList.add('show'));
    scrollToBottom();
  }

  function handleChoiceClick(choice, myToken){
    const needsWarning = settings.difficulty==='easy' && choice.risk==='danger' && !easyWarningUsed;
    if(needsWarning){
      warnModal.classList.add('show');
      const onCancel = ()=>{ cleanup(); };
      const onProceed = ()=>{ cleanup(); easyWarningUsed = true; commitChoice(choice, myToken); };
      function cleanup(){
        warnModal.classList.remove('show');
        $('warn-cancel').removeEventListener('click', onCancel);
        $('warn-proceed').removeEventListener('click', onProceed);
      }
      $('warn-cancel').addEventListener('click', onCancel);
      $('warn-proceed').addEventListener('click', onProceed);
      return;
    }
    commitChoice(choice, myToken);
  }

  async function commitChoice(choice, myToken){
    clearChoiceTimeout();
    SoundEngine.send();
    choicesEl.classList.remove('show');
    await appendMeMessage(choice.label, myToken);
    if(myToken !== genToken) return;
    setTimeout(()=> runNode(choice.next), 250);
  }

  // ------------------------------------------------------------
  // リザルト
  // ------------------------------------------------------------
  function finishScenario(ending){
    clearChoiceTimeout();
    const unlockedChar = currentScenario ? recordEnding(currentScenario.id, ending.type) : null;
    renderList();

    const card = $('result-card');
    card.className = 'result-card ' + ending.type;
    $('result-icon').textContent = ending.type==='success' ? '🎉' : '💀';
    $('result-kicker').textContent = ending.type==='success' ? '救出成功' : 'BAD END';
    $('result-title').textContent = ending.title;
    $('result-desc').textContent = ending.desc;
    $('result-unlock').textContent = unlockedChar ? `新着SOS：${unlockedChar.name}が解放されました` : '';
    resultModal.classList.add('show');
    if(unlockedChar) setTimeout(()=> showToast(unlockedChar.name+'から新着SOSが届きました'), 500);
  }

  $('retry-btn').addEventListener('click', ()=>{ resultModal.classList.remove('show'); easyWarningUsed=false; startChat(); });
  $('backlist-btn').addEventListener('click', ()=>{ resultModal.classList.remove('show'); genToken++; showScreen(homeScreen); });

  // ------------------------------------------------------------
  // 初期化
  // ------------------------------------------------------------
  renderList();
  document.addEventListener('pointerdown', ()=> SoundEngine.unlock(), {once:true});

})();
</script>
