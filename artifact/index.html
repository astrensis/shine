<title>既読スルー禁止</title>
<style>
  :root{
    --bg-outer:#050506;
    --frame-shadow: rgba(0,0,0,.6);
    --list-bg:#111318;
    --list-header:#0c0e12;
    --list-border: rgba(255,255,255,.06);
    --list-text:#f2f3f5;
    --list-sub:#8a8f98;
    --danger:#e5484d;
    --success:#2fbf71;
    --warn:#f2b134;
    --chat-bg:#93bfe0;
    --chat-header:#3a3a3a;
    --bubble-them:#ffffff;
    --bubble-me:#8fe05a;
    --bubble-text:#141414;
    --accent:#06c755;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ color-scheme: dark; }
  }
  :root[data-theme="dark"]{ color-scheme: dark; }

  *{box-sizing:border-box;}
  body{
    background:var(--bg-outer);
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding-block:24px;
  }
  #stage{
    width:100%;
    max-width:430px;
    height:min(880px, calc(100dvh - 48px));
    background:#000;
    border-radius:34px;
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 80px var(--frame-shadow), 0 0 0 1px rgba(255,255,255,.05);
  }
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- Chat List ---------- */
  #list-screen{ background:var(--list-bg); }
  .list-header{
    background:var(--list-header);
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--list-border);
  }
  .list-header h1{
    color:var(--list-text);
    font-size:19px;
    font-weight:800;
    letter-spacing:.02em;
    margin:0;
  }
  .reset-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,.14);
    color:var(--list-sub);
    font-size:11px;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    font-family:inherit;
  }
  .reset-btn:hover{ color:var(--list-text); border-color:rgba(255,255,255,.3); }

  .thread-list{ flex:1; overflow-y:auto; }
  .thread{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 18px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--list-border);
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .thread:hover{ background:rgba(255,255,255,.04); }
  .thread-avatar{
    width:50px;height:50px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;position:relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .unread-dot{
    position:absolute; top:-2px; right:-2px;
    width:17px;height:17px;border-radius:50%;
    background:var(--danger); color:#fff;
    font-size:10px; font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--list-bg);
  }
  .thread-body{ flex:1; min-width:0; }
  .thread-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .thread-name{ color:var(--list-text); font-size:15px; font-weight:700; }
  .thread-sub{
    color:var(--list-sub); font-size:12.5px; margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .badge{
    font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px;
    border:1px solid; flex-shrink:0; white-space:nowrap;
  }
  .badge.success{ color:var(--success); border-color:rgba(47,191,113,.4); background:rgba(47,191,113,.12); }
  .badge.bad{ color:var(--danger); border-color:rgba(229,72,77,.4); background:rgba(229,72,77,.12); }
  .badge.progress{ color:var(--warn); border-color:rgba(242,177,52,.4); background:rgba(242,177,52,.12); }

  .list-footer{
    padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--list-border);
    display:flex; justify-content:center; gap:36px;
    color:#4a4e57;
  }

  /* ---------- Chat Room ---------- */
  #chat-screen{ background:var(--chat-bg); }
  .chat-header{
    background:var(--chat-header);
    color:#fff;
    padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
    position:relative; z-index:2;
  }
  .icon-btn{
    background:transparent;border:none;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:6px; opacity:.9;
  }
  .icon-btn:hover{ opacity:1; }
  .chat-header-avatar{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .chat-header-info{ flex:1; min-width:0; }
  .chat-header-name{ font-size:14px; font-weight:700; }
  .chat-header-status{ font-size:10.5px; margin-top:1px; color:#c7c7c7; }
  .chat-header-status.typing{ color:#8fe05a; }
  .chat-header-status.offline{ color:var(--danger); }

  .timeline{ flex:1; overflow-y:auto; padding:14px 0; position:relative; z-index:1; }

  .msg-row{ display:flex; padding:0 12px; margin:6px 0; }
  .msg-row.them{ justify-content:flex-start; }
  .msg-row.me{ justify-content:flex-end; }
  .msg-avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:14px;
    flex-shrink:0; margin-right:7px; align-self:flex-end;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .msg-wrap{ display:flex; align-items:flex-end; gap:6px; max-width:74%; }
  .msg-row.me .msg-wrap{ flex-direction:row-reverse; }
  .bubble{
    padding:9px 13px; border-radius:17px; font-size:14px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .msg-row.them .bubble{ background:var(--bubble-them); color:var(--bubble-text); border-bottom-left-radius:5px; }
  .msg-row.me .bubble{ background:var(--bubble-me); color:var(--bubble-text); border-bottom-right-radius:5px; }
  .msg-meta{
    display:flex; flex-direction:column; font-size:10px; color:rgba(20,20,20,.55);
    flex-shrink:0; line-height:1.5;
  }
  .msg-row.them .msg-meta{ align-items:flex-start; }
  .msg-row.me .msg-meta{ align-items:flex-end; }

  .sys-row{ display:flex; justify-content:center; padding:10px 26px; }
  .sys-inner{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:88%; }
  .sys-text{
    font-size:11px; color:rgba(20,20,20,.65); background:rgba(255,255,255,.55);
    padding:4px 12px; border-radius:999px; text-align:center;
  }

  .eerie-frame{
    width:100%; max-width:210px; border-radius:11px; overflow:hidden;
    border:1px solid rgba(0,0,0,.4); box-shadow:0 6px 18px rgba(0,0,0,.35);
    animation: flicker 2.6s linear infinite;
  }
  .eerie-frame svg{ display:block; width:100%; aspect-ratio:3/2; background:#000; }
  .eerie-caption{
    background:rgba(0,0,0,.82); color:#9aa0a8; font-size:9.5px;
    font-family:ui-monospace,monospace; padding:4px 8px;
  }

  .glitch{
    position:relative; display:inline-block; color:#ff3b3b;
    text-shadow:2px 0 #00e5ff, -2px 0 #ff00c8;
    animation: glitchJitter .13s infinite steps(2);
  }

  .typing-row{ display:flex; padding:0 12px; margin:6px 0; align-items:flex-end; }
  .typing-bubble{
    background:#fff; border-radius:17px; border-bottom-left-radius:5px;
    padding:11px 15px; display:flex; gap:4px; box-shadow:0 1px 2px rgba(0,0,0,.15);

  .typing-dot:nth-child(2){ animation-delay:.15s; }
  .typing-dot:nth-child(3){ animation-delay:.3s; }

  .choices{
    flex-shrink:0; background:#eef1f4; border-top:1px solid rgba(0,0,0,.08);
    padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:9px; z-index:2; position:relative;
  }
  .choice-btn{
    width:100%; text-align:left; padding:13px 15px; border-radius:14px;
    background:#fff; border:1px solid rgba(0,0,0,.06); box-shadow:0 2px 6px rgba(0,0,0,.08);
    font-size:13.5px; color:#1a1a1a; font-weight:600; cursor:pointer; font-family:inherit;
    transition:transform .1s ease, background .15s ease;
  }
  .choice-btn:hover{ background:#fafafa; }
  .choice-btn:active{ transform:scale(.98); }

  .call-flash{
    position:absolute; inset:0; z-index:30; background:#000;
    display:flex; align-items:center; justify-content:center;
    animation: flashRed .5s ease-in-out 2;
  }
  .call-flash span{ color:var(--danger); font-family:ui-monospace,monospace; font-size:12.5px; letter-spacing:.08em; }

  /* ---------- Result Modal ---------- */
  #result-modal{
    position:absolute; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; padding:26px;
    background:rgba(0,0,0,.82); backdrop-filter: blur(2px);
  }
  #result-modal.show{ display:flex; }
  .result-card{
    width:100%; max-width:320px; border-radius:20px; padding:28px 24px;
    text-align:center; background:#111318; border:1px solid rgba(255,255,255,.08);
  }
  .result-card.success{ border-color:rgba(47,191,113,.35); }
  .result-card.bad{ border-color:rgba(229,72,77,.4); }
  .result-icon{ font-size:44px; margin-bottom:6px; }
  .result-kicker{ font-size:12px; font-weight:800; letter-spacing:.08em; margin-bottom:4px; }
  .result-card.success .result-kicker{ color:var(--success); }
  .result-card.bad .result-kicker{ color:var(--danger); }
  .result-title{ color:#fff; font-size:17px; font-weight:800; margin-bottom:10px; }
  .result-desc{ color:#a8adb5; font-size:13px; line-height:1.7; margin-bottom:22px; }
  .result-actions{ display:flex; flex-direction:column; gap:9px; }
  .result-btn{
    width:100%; padding:12px; border-radius:999px; border:none; cursor:pointer;
    font-size:13.5px; font-weight:700; font-family:inherit;
  }
  .result-btn.retry{ background:rgba(255,255,255,.1); color:#fff; }
  .result-btn.retry:hover{ background:rgba(255,255,255,.16); }
  .result-btn.back{ background:var(--accent); color:#fff; }
  .result-btn.back:hover{ filter:brightness(1.08); }

  /* ---------- effects ---------- */
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    10%{ transform:translate(-2px,1px); }
    20%{ transform:translate(2px,-1px); }
    30%{ transform:translate(-3px,0); }
    40%{ transform:translate(3px,1px); }
    50%{ transform:translate(-1px,-2px); }
    60%{ transform:translate(1px,2px); }
    70%{ transform:translate(-2px,-1px); }
    80%{ transform:translate(2px,1px); }
    90%{ transform:translate(-1px,0); }
  }
  @keyframes shakeHard{
    0%,100%{ transform:translate(0,0); }
    25%{ transform:translate(-4px,2px); }
    50%{ transform:translate(4px,-2px); }
    75%{ transform:translate(-3px,-3px); }
  }
  .fx-shake{ animation:shake .4s ease-in-out; }
  .fx-shake-hard{ animation:shakeHard .12s ease-in-out 4; }
  @keyframes flashRed{
    0%,100%{ background-color:transparent; }
    50%{ background-color:rgba(220,38,38,.32); }
  }
  .fx-flash{ animation:flashRed .5s ease-in-out 2; }
  @keyframes flicker{
    0%,100%{ opacity:1; } 45%{ opacity:1; } 46%{ opacity:.3; }
    47%{ opacity:1; } 48%{ opacity:.2; } 49%{ opacity:1; }
  }
  @keyframes glitchJitter{
    0%{ transform:translate(0,0); } 25%{ transform:translate(-1px,1px); }
    50%{ transform:translate(1px,-1px); } 75%{ transform:translate(-1px,-1px); }
    100%{ transform:translate(1px,1px); }
  }
  @keyframes bounceDot{
    0%,80%,100%{ transform:translateY(0); opacity:.5; }
    40%{ transform:translateY(-4px); opacity:1; }
  }

  #hint{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    font-size:11px; color:#5a5e66; font-family:inherit; z-index:5;
    pointer-events:none; opacity:.8;
  }

  @media (prefers-reduced-motion: reduce){
    .fx-shake,.fx-shake-hard,.fx-flash,.eerie-frame,.glitch,.typing-dot{ animation:none !important; }
  }
</style>

<script>
(function(){
  "use strict";

  // ============================================================
  // 1. サウンドエンジン (Web Audio API / 外部音声ファイル不使用)
  // ============================================================
  const SoundEngine = (function(){
    let ctx = null, master = null;
    function ensure(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
      }
      if(ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function unlock(){ try{ ensure(); }catch(e){} }

    function tone(freq, start, dur, opt){
      opt = opt || {};
      const c = ensure();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = opt.type || 'sine';
      osc.frequency.setValueAtTime(freq, start);
      if(opt.freqEnd !== undefined){
        osc.frequency.exponentialRampToValueAtTime(Math.max(opt.freqEnd,1), start+dur);
      }
      const peak = opt.gain !== undefined ? opt.gain : 0.3;
      const attack = opt.attack !== undefined ? opt.attack : 0.01;
      const release = opt.release !== undefined ? opt.release : dur*0.6;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start+attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+attack+release);
      osc.connect(gain); gain.connect(master);
      osc.start(start); osc.stop(start+dur+0.05);
    }

    function noiseBuffer(dur){
      const c = ensure();
      const size = Math.floor(c.sampleRate*dur);
      const buf = c.createBuffer(1, size, c.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<size;i++) data[i] = Math.random()*2-1;
      return buf;
    }

    return {
      unlock,
      receive(){
        const c = ensure(); const now = c.currentTime;
        tone(1046.5, now, 0.12, {gain:.25, attack:.005});
        tone(1318.5, now+0.09, 0.15, {gain:.22, attack:.005});
      },
      send(){
        const c = ensure(); const now = c.currentTime;
        tone(700, now, 0.08, {freqEnd:900, gain:.18, attack:.005});
      },
      heartbeat(){
        const c = ensure(); const now = c.currentTime;
        tone(60, now, 0.15, {gain:.5, freqEnd:40, attack:.01, release:.1});
        tone(55, now+0.16, 0.15, {gain:.4, freqEnd:35, attack:.01, release:.1});
      },
      fearNoise(dur){
        dur = dur || 0.8;
        const c = ensure(); const now = c.currentTime;
        const noise = c.createBufferSource();
        noise.buffer = noiseBuffer(dur);
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.exponentialRampToValueAtTime(0.18, now+0.05);
        ng.gain.exponentialRampToValueAtTime(0.0001, now+dur);
        const filt = c.createBiquadFilter();
        filt.type='bandpass'; filt.frequency.value=1200; filt.Q.value=0.7;
        noise.connect(filt); filt.connect(ng); ng.connect(master);
        noise.start(now); noise.stop(now+dur);
        tone(185, now, dur, {type:'sawtooth', gain:.12, attack:.02, release:dur*.8});
        tone(196, now+0.02, dur, {type:'sawtooth', gain:.1, attack:.02, release:dur*.8});
      },
      callEnd(){
        const c = ensure(); const now = c.currentTime;
        const noise = c.createBufferSource();
        noise.buffer = noiseBuffer(0.6);
        const g = c.createGain();
        g.gain.setValueAtTime(0.3, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now+0.6);
        const filt = c.createBiquadFilter();
        filt.type='highpass'; filt.frequency.value=800;
        noise.connect(filt); filt.connect(g); g.connect(master);
        noise.start(now); noise.stop(now+0.6);
        tone(320, now, 0.3, {type:'square', gain:.15, freqEnd:60});
      },
      alarm(){
        const c = ensure(); const now = c.currentTime;
        for(let i=0;i<4;i++){
          const t = now+i*0.3;
          tone(880, t, 0.15, {type:'square', gain:.2});
          tone(660, t+0.15, 0.15, {type:'square', gain:.2});
        }
      }
    };
  })();

  function playSound(name){
    switch(name){
      case 'receive': SoundEngine.receive(); break;
      case 'send': SoundEngine.send(); break;
      case 'heartbeat': SoundEngine.heartbeat(); break;
      case 'noise': SoundEngine.fearNoise(); break;
      case 'callEnd': SoundEngine.callEnd(); break;
      case 'alarm': SoundEngine.alarm(); break;
    }
  }

  // ============================================================
  // 2. 不穏な画像プレースホルダー (SVG生成)
  // ============================================================
  function eerieSvg(kind){
    switch(kind){
      case 'doorscope': return `

  // ============================================================
  // 4. セーブデータ (localStorage)
  // ============================================================
  const SAVE_KEY = 'line-horror-save-v1';
  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return {};
      return JSON.parse(raw) || {};
    }catch(e){ return {}; }
  }
  function saveSave(data){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }catch(e){}
  }
  let save = loadSave();
  function setStatus(id, status){
    save[id] = status;
    saveSave(save);
  }

  let currentScenario = null;

  let genToken = 0; // シーン遷移の世代管理（古い非同期処理を無効化する）

  // ------------------------------------------------------------
  // トーク一覧描画
  // ------------------------------------------------------------
  function renderList(){
    threadList.innerHTML = '';
    scenarios.forEach(sc=>{
      const status = save[sc.id] || 'unread';
      const btn = document.createElement('button');
      btn.className = 'thread';
      btn.innerHTML = `
        <div class="thread-avatar" style="background:${sc.character.color}">
          ${sc.character.emoji}
          ${status==='unread' ? '<span class="unread-dot">1</span>' : ''}
        </div>
        <div class="thread-body">
          <div class="thread-top">
            <span class="thread-name">${sc.character.name}</span>
            ${badgeHtml(status)}
          </div>
          <div class="thread-sub">${sc.title} ─ ${sc.description}</div>
        </div>
      `;
      btn.addEventListener('click', ()=> openScenario(sc.id));
      threadList.appendChild(btn);
    });
  }
  function badgeHtml(status){
    if(status==='success') return '<span class="badge success">救出成功</span>';
    if(status==='bad') return '<span class="badge bad">音信不通</span>';
    if(status==='progress') return '<span class="badge progress">進行中</span>';
    return '';
  }

  $('reset-btn').addEventListener('click', ()=>{
    if(confirm('すべてのプレイ状況をリセットします。よろしいですか？')){
      save = {};
      saveSave(save);
      renderList();
    }
  });

  // ------------------------------------------------------------
  // 画面遷移
  // ------------------------------------------------------------
  function showScreen(el){
    [listScreen, chatScreen].forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
  }

  function openScenario(id){
    SoundEngine.unlock();
    currentScenario = getScenario(id);
    setStatus(id, 'progress');
    renderList();
    startChat();
    showScreen(chatScreen);
  }

  $('back-btn').addEventListener('click', ()=>{
    genToken++; // 進行中の非同期メッセージ処理を打ち切る
    showScreen(listScreen);
  });

  function handleCallTap(){
    SoundEngine.callEnd();
    const flash = document.createElement('div');
    flash.className = 'call-flash';
    flash.innerHTML = '<span>通話が強制切断されました</span>';
    callFlashHolder.appendChild(flash);
    setTimeout(()=> flash.remove(), 800);
  }
  $('call-btn').addEventListener('click', handleCallTap);
  $('video-btn').addEventListener('click', handleCallTap);

  // チャット進行エンジン
  // ------------------------------------------------------------
  function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

  function startChat(){
    timelineEl.innerHTML = '';
    choicesEl.style.display = 'none';
    choicesEl.innerHTML = '';
    chatAvatar.style.background = currentScenario.character.color;
    chatAvatar.textContent = currentScenario.character.emoji;
    chatName.textContent = currentScenario.character.name;
    setChatStatus('オンライン');
    runNode(currentScenario.startNodeId);
  }

  function setChatStatus(text){
    chatStatus.textContent = text;
    chatStatus.className = 'chat-header-status' +
      (text==='入力中...' ? ' typing' : text==='オフライン' ? ' offline' : '');
  }

  function nowLabel(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  function triggerScreenEffect(effect){
    if(!effect || effect==='none') return;
    const cls = effect==='shake' ? 'fx-shake' : effect==='shake-hard' ? 'fx-shake-hard' : effect==='flash' ? 'fx-flash' : null;
    if(!cls) return;
    chatScreen.classList.remove('fx-shake','fx-shake-hard','fx-flash');
    void chatScreen.offsetWidth; // reflow to restart animation
    chatScreen.classList.add(cls);
    setTimeout(()=> chatScreen.classList.remove(cls), 650);
  }

  function appendMessage(msg){
    const time = nowLabel();
    if(msg.sender === 'system'){
      const row = document.createElement('div');
      row.className = 'sys-row';
      let inner = '<div class="sys-inner">';
      if(msg.text) inner += `<span class="sys-text">${escapeHtml(msg.text)}</span>`;
      if(msg.image){
        inner += `<div class="eerie-frame">${eerieSvg(msg.image.kind)}</div>`;
        if(msg.image.caption) inner += `<div class="eerie-caption">${escapeHtml(msg.image.caption)}</div>`;
      }
      inner += '</div>';
      row.innerHTML = inner;
      timelineEl.appendChild(row);
      return;
    }

    const isMe = msg.sender === 'me';
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isMe ? 'me' : 'them');

    const avatarHtml = !isMe ? `<div class="msg-avatar" style="background:${currentScenario.character.color}">${currentScenario.character.emoji}</div>` : '';
    const textHtml = msg.glitch ? `<span class="glitch">${escapeHtml(msg.text)}</span>` : escapeHtml(msg.text);
    const metaHtml = `<div class="msg-meta">${isMe ? '<span>既読</span>' : ''}<span>${time}</span></div>`;

    row.innerHTML = `
      ${avatarHtml}
      <div class="msg-wrap">
        <div class="bubble">${textHtml}</div>
        ${metaHtml}
      </div>
    `;
    timelineEl.appendChild(row);
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, (c)=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function showTyping(show){
    let row = document.getElementById('typing-row');
    if(show){
      if(row) return;
      row = document.createElement('div');
      row.id = 'typing-row';
      row.className = 'typing-row';
      row.innerHTML = `
        <div class="msg-avatar" style="background:${currentScenario.character.color}">${currentScenario.character.emoji}</div>
        <div class="typing-bubble">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>`;
      timelineEl.appendChild(row);
      scrollToBottom();
    } else if(row){
      row.remove();
    }
  }

  function scrollToBottom(){
    timelineEl.scrollTop = timelineEl.scrollHeight;
  }

  async function runNode(nodeId){
    const myToken = ++genToken;
    const node = currentScenario.nodes[nodeId];
    if(!node) return;

    for(const msg of node.messages){
      if(myToken !== genToken) return;

      if(msg.sender === 'them'){
        setChatStatus('入力中...');
        showTyping(true);
        await wait(msg.delay || (1000 + Math.random()*1500));
        if(myToken !== genToken) return;
        showTyping(false);
        setChatStatus('オンライン');
      } else if(msg.delay){
        await wait(msg.delay);
        if(myToken !== genToken) return;
      }

      appendMessage(msg);
      playSound(msg.sound);
      if(msg.effect) triggerScreenEffect(msg.effect);
      scrollToBottom();
      await wait(250);
      if(myToken !== genToken) return;
    }

    if(myToken !== genToken) return;

    if(node.ending){
      setChatStatus('オフライン');
      await wait(600);
      if(myToken !== genToken) return;
      finishScenario(node.ending);
      return;
    }

    if(node.choices && node.choices.length){
      renderChoices(node.choices);
      return;
    }

    if(node.autoNext){
      await wait(node.autoDelay || 1200);
      if(myToken !== genToken) return;
      runNode(node.autoNext);
    }
  }

  function renderChoices(choices){
    choicesEl.innerHTML = '';
    choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.label;
      btn.addEventListener('click', ()=>{
        SoundEngine.send();
        appendMessage({sender:'me', text:choice.label});
        scrollToBottom();
        choicesEl.style.display = 'none';
        setTimeout(()=> runNode(choice.next), 400);
      });
      choicesEl.appendChild(btn);
    });
    choicesEl.style.display = 'flex';
    scrollToBottom();
  }

  // ------------------------------------------------------------
  // リザルトモーダル
  // ------------------------------------------------------------
  function finishScenario(ending){
    setStatus(currentScenario.id, ending.type);
    renderList();

    const card = $('result-card');
    card.className = 'result-card ' + ending.type;
    $('result-icon').textContent = ending.type==='success' ? '🎉' : '💀';
    $('result-kicker').textContent = ending.type==='success' ? '救出成功' : 'BAD END';
    $('result-title').textContent = ending.title;
    $('result-desc').textContent = ending.desc;
    resultModal.classList.add('show');
  }

  $('retry-btn').addEventListener('click', ()=>{
    resultModal.classList.remove('show');
    startChat();
  });
  $('backlist-btn').addEventListener('click', ()=>{
    resultModal.classList.remove('show');
    genToken++;
    showScreen(listScreen);
  });

  // ------------------------------------------------------------
  // 初期化
  // ------------------------------------------------------------
  renderList();
  document.addEventListener('pointerdown', ()=> SoundEngine.unlock(), {once:true});

})();
</script>
